<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Tracker">
<title>Study Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f9f7f4;--surface:#ffffff;--border:#e8e4de;--border2:#d4cfc8;
  --text:#1e1c1a;--text2:#6b6560;--text3:#a09890;
  --accent:#c0664a;--accent-light:#f5ede9;--accent-mid:#e8957a;
  --nav-h:64px;--radius:10px;--radius-sm:7px;--radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}

/* ── ログイン画面 ── */
#login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 24px;
}
.login-logo{margin-bottom:12px}
.login-logo svg{display:block}
.login-title{font-size:24px;font-weight:700;color:var(--text);letter-spacing:.01em;margin-bottom:8px;text-align:center}
.login-sub{font-size:14px;color:var(--text3);text-align:center;line-height:1.6;margin-bottom:48px}
.login-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:28px 24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--surface);font-size:14px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit;transition:background .15s}
.google-btn:active{background:var(--bg)}
.login-divider{display:flex;align-items:center;gap:10px;color:var(--text3);font-size:12px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:0.5px;background:var(--border)}
.skip-btn{padding:11px;border:none;background:transparent;font-size:13px;color:var(--text3);cursor:pointer;font-family:inherit;text-align:center}
.skip-btn:active{color:var(--text2)}
.login-note{font-size:11px;color:var(--text3);text-align:center;line-height:1.6;margin-top:4px}

/* ── メインアプリ ── */
#main-screen{display:none}
.app{max-width:480px;margin:0 auto;padding:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px));min-height:100vh}
.header{padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 0;margin-bottom:20px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left h1{font-size:17px;font-weight:600;letter-spacing:.01em;color:var(--text)}
.header-left p{font-size:12px;color:var(--text3);margin-top:3px}
.header-right{display:flex;align-items:center;gap:8px}
.header-streak{display:flex;align-items:center;gap:5px;background:var(--accent-light);border:0.5px solid var(--accent-mid);border-radius:99px;padding:5px 12px;flex-shrink:0}
.header-streak-num{font-size:16px;font-weight:700;color:var(--accent);line-height:1}
.header-streak-label{font-size:11px;color:var(--accent);white-space:nowrap}
.user-badge{font-size:11px;color:var(--text2);background:var(--surface);border:0.5px solid var(--border2);border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.user-badge:active{background:var(--bg)}
.sync-badge{font-size:10px;color:var(--text3);padding:0 16px;margin-bottom:6px;min-height:18px}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:rgba(250,248,245,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:0.5px solid var(--border);display:flex;align-items:flex-start;z-index:100}
.nav-btn{flex:1;height:var(--nav-h);border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:var(--text3);font-size:10px;font-family:inherit;position:relative;transition:color .2s}
.nav-btn.active{color:var(--accent)}
.nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.nav-btn.active .nav-icon{transform:scale(1.13)}
.nav-label{font-size:10px;letter-spacing:.02em;transition:opacity .2s}
.nav-btn:not(.active) .nav-label{opacity:.55}
.nav-btn::after{content:'';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .2s}
.nav-btn.active::after{opacity:1}
/* cards */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;margin-bottom:16px}
.mc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 12px 10px}
.mc-label{font-size:10px;color:var(--text3);margin-bottom:5px;letter-spacing:.02em}
.mc-value{font-size:19px;font-weight:600;color:var(--text);line-height:1}
.mc-sub{font-size:10px;color:var(--text3);margin-top:3px}
.today-big{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:18px 16px;margin:0 16px 16px;text-align:center}
.today-big-num{font-size:64px;font-weight:700;color:var(--accent);line-height:1}
.today-big-label{font-size:12px;color:var(--text3);margin-top:6px}
.goal-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px}
.goal-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.goal-label{font-size:13px;color:var(--text);font-weight:500;flex:1}
.goal-input{padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);-webkit-appearance:none;font-family:inherit}
.goal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gs-item{text-align:center}
.gs-val{font-size:16px;font-weight:600;color:var(--text)}
.gs-label{font-size:10px;color:var(--text3);margin-top:2px}
.sec-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text3);padding:0 16px;margin-bottom:8px}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:16px}
.fc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 14px 12px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.fc:active{border-color:var(--accent-mid)}
.fc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fc-name{font-size:13px;font-weight:600;color:var(--text)}
.fc-arrow{font-size:11px;color:var(--text3);transition:transform .2s}
.fc-arrow.open{transform:rotate(180deg)}
.fc-lap{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:3px}
.fc-goal-line{font-size:11px;color:var(--text3);margin-bottom:8px}
.counter-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.cnt-btn{width:36px;height:36px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cnt-btn:active{background:var(--accent-light);transform:scale(.93)}
.cnt-num{font-size:24px;font-weight:700;color:var(--text);flex:1;text-align:center;line-height:1}
.fc-bar-bg{height:5px;background:var(--accent-light);border-radius:99px;overflow:hidden}
.fc-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.fc-detail{margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);display:none;flex-direction:column;gap:8px}
.fc-detail.open{display:flex}
.fc-detail-row{display:flex;justify-content:space-between;align-items:center}
.fc-detail-label{font-size:11px;color:var(--text3)}
.fc-detail-val{font-size:12px;font-weight:600;color:var(--text)}
.fc-memo{font-size:11px;color:var(--text2);font-style:italic}
.fc-log-title{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--text3);margin-top:2px}
.fc-log-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.fc-log-item{display:flex;align-items:center;gap:6px;font-size:11px}
.fc-log-time{color:var(--text3);white-space:nowrap;flex-shrink:0}
.fc-log-badge{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.fc-log-badge.plus{background:var(--accent-light);color:var(--accent)}
.fc-log-badge.minus{background:#f1efe8;color:var(--text3)}
.fc-log-text{color:var(--text2)}
.settings-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.sc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.sc-head{display:flex;align-items:center;margin-bottom:10px;gap:8px}
.sc-name-input{flex:1;padding:5px 8px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-weight:600;background:var(--bg);color:var(--text);font-family:inherit}
.sc-del{font-size:12px;color:var(--accent);border:0.5px solid #f0c4b8;border-radius:6px;padding:3px 8px;background:transparent;cursor:pointer;font-family:inherit;white-space:nowrap}
.sc-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.sc-field{display:flex;flex-direction:column;gap:4px}
.sc-fl{font-size:10px;color:var(--text3)}
.sc-input{padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);width:100%;font-family:inherit}
.sc-mastery{font-size:13px;font-weight:600;color:var(--accent);padding:6px 8px;background:var(--accent-light);border-radius:var(--radius-sm);text-align:center}
.sc-textarea{width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:12px;resize:none;min-height:52px;background:var(--bg);color:var(--text);font-family:inherit}
.add-field-card{background:var(--accent-light);border:0.5px dashed var(--accent-mid);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px;display:flex;gap:8px;align-items:center}
.add-field-card input{flex:1;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);font-family:inherit}
.btn-add{padding:8px 16px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-add:active{opacity:.8}
.hm-wrap{padding:0 16px;margin-bottom:16px}
.hm-field-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.hm-field-scroll::-webkit-scrollbar{display:none}
.hm-fb{padding:5px 14px;border-radius:99px;border:0.5px solid var(--border2);background:var(--surface);font-size:12px;cursor:pointer;color:var(--text2);white-space:nowrap;font-family:inherit}
.hm-fb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hm-month-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px}
.hm-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.hm-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.hm-dow{font-size:9px;color:var(--text3);text-align:center}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.hm-cell{aspect-ratio:1;border-radius:4px}
.hm-cell.today-cell{outline:2px solid var(--accent);outline-offset:1px}
.hm-legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:10px;color:var(--text3)}
.hm-lc{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.data-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 10px;display:flex;gap:8px;flex-wrap:wrap}
.btn-io{flex:1;padding:9px 12px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;text-align:center;min-width:100px;font-family:inherit}
.btn-io:active{background:var(--accent-light)}
.logout-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px;display:flex;align-items:center;justify-content:space-between}
.logout-user{font-size:13px;color:var(--text2)}
.logout-btn{padding:7px 14px;border-radius:var(--radius-sm);border:0.5px solid #f0c4b8;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;font-family:inherit}
.hint-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px;font-size:12px;color:var(--text2);line-height:1.7}
.hint-card b{color:var(--text);font-weight:600}
.tab-pane{animation:tabFade .18s ease}
@keyframes tabFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="login-logo">
    <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
      <rect width="56" height="56" rx="14" fill="#f5ede9"/>
      <rect x="10.75" y="18.75" width="14.5" height="18.5" rx="4.25" stroke="#c0664a" stroke-width="1.8"/>

<!-- メインアプリ -->
<div id="main-screen">
  <div class="app">
    <div class="header">
      <div class="header-row">
        <div class="header-left">
          <h1>Study Tracker</h1>
          <p id="header-date"></p>

      </button>
      <button class="nav-btn" onclick="showTab('heatmap')" id="nav-heatmap">

            <rect x="5.5" y="15" width="2.5" height="2.5" rx=".6" fill="currentColor"/>
            <rect x="10.75" y="15" width="2.5" height="2.5" rx=".6" fill="currentColor" opacity=".4"/>
            <rect x="16" y="15" width="2.5" height="2.5" rx=".6" fill="currentColor" opacity=".7"/>
          </svg>
        </div>
        <span class="nav-label">ヒートマップ</span>
      </button>
      <button class="nav-btn" onclick="showTab('settings')" id="nav-settings">
        <div class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.4"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M5.1 18.9l1.4-1.4M17.5 6.5l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="nav-label">設定</span>
      </button>
    </nav>
  </div>
</div>

  return defaultData();
}
function saveLocal(d){try{localStorage.setItem(LS_KEY,JSON.stringify(d));}catch(e){}}
var data=loadLocal();
data.fields.forEach(function(f){
  if(f.prevSolved===undefined)f.prevSolved=0;
  if(f.mastery!==undefined)delete f.mastery;
  if(!f.logs)f.logs=[];
});

async function saveToCloud(){
  if(!currentUser)return;
  try{
    await sb.from('study_data').upsert({user_id:currentUser.id,data:data,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    showSync('☁ 保存しました');
  }catch(e){console.error(e);}
}
async function loadFromCloud(){
  if(!currentUser)return false;
  try{
    var res=await sb.from('study_data').select('data').eq('user_id',currentUser.id).single();
    if(res.data&&res.data.data){
      data=res.data.data;
      data.fields.forEach(function(f){if(f.prevSolved===undefined)f.prevSolved=0;if(!f.logs)f.logs=[];});
      saveLocal(data);return true;
    }
  }catch(e){}
  return false;
}
async function migrateLocalToCloud(){
  var local=loadLocal();
  var hasLocal=local.fields.some(function(f){return Object.keys(f.counts||{}).length>0||f.prevSolved>0;});
  if(!hasLocal)return;
  var res=await sb.from('study_data').select('id').eq('user_id',currentUser.id).single();
  if(res.error||!res.data){data=local;await saveToCloud();showSync('☁ ローカルデータを移行しました');}
}
function save(){saveLocal(data);if(currentUser)saveToCloud();}
function showSync(msg){
  var el=document.getElementById('sync-status');
  if(el){el.textContent=msg;setTimeout(function(){el.textContent='';},3000);}
}

// 画面切り替え
function showLoginScreen(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('main-screen').style.display='none';
}
function showMainScreen(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
  renderCounter();
}

async function loginWithGoogle(){
  await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}});
}
async function skipLogin(){
  showMainScreen();
}

async function initAuth(){
  var session=await sb.auth.getSession();
  if(session.data&&session.data.session){
    currentUser=session.data.session.user;
    await migrateLocalToCloud();
    var loaded=await loadFromCloud();
    if(loaded)showSync('☁ クラウドから読み込みました');
    showMainScreen();
  } else {
    showLoginScreen();
  }
  sb.auth.onAuthStateChange(async function(event,session){
    if(event==='SIGNED_IN'&&session){
      currentUser=session.user;
      await migrateLocalToCloud();
      var loaded=await loadFromCloud();
      if(loaded)showSync('☁ クラウドから読み込みました');
      showMainScreen();
    } else if(event==='SIGNED_OUT'){
      currentUser=null;
      data=loadLocal();
      showLoginScreen();
    }
  });
}

var nowD=new Date();
document.getElementById('header-date').textContent=
  nowD.getFullYear()+'年'+(nowD.getMonth()+1)+'月'+nowD.getDate()+'日（'+DOWS[nowD.getDay()]+'）';

function todayStr(){return new Date().toISOString().slice(0,10);}
function totalCounted(f){var s=0;Object.keys(f.counts||{}).forEach(function(k){s+=f.counts[k];});return s;}
function totalSolved(f){return (f.prevSolved||0)+totalCounted(f);}
function progress(f){return f.total>0?Math.min(100,Math.round(totalSolved(f)/f.total*100)):0;}
function lapCount(f){return f.total>0?Math.floor(totalSolved(f)/f.total)+1:1;}
function todayCount(f){return(f.counts||{})[todayStr()]||0;}
function calcStreak(){
  var allDates={};
  data.fields.forEach(function(f){Object.keys(f.counts||{}).forEach(function(k){if(f.counts[k]>0)allDates[k]=true;});});
  var streak=0;var d=new Date();
  if(!allDates[todayStr()])d.setDate(d.getDate()-1);
  while(true){var key=d.toISOString().slice(0,10);if(!allDates[key])break;streak++;d.setDate(d.getDate()-1);}
  return streak;
}
function updateHeaderStreak(){var el=document.getElementById('streak-num');if(el)el.textContent=calcStreak();}
function fmtTime(ts){
  var d=new Date(ts);var h=String(d.getHours()).padStart(2,'0');var m=String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString()===new Date().toDateString())return h+':'+m;
  return (d.getMonth()+1)+'/'+d.getDate()+' '+h+':'+m;
}

function showTab(name){
  openCards={};currentTab=name;
  ['counter','heatmap','settings'].forEach(function(t){
    document.getElementById('tab-'+t).style.display=t===name?'':'none';
    document.getElementById('nav-'+t).classList.toggle('active',t===name);
  });
  if(name==='counter')renderCounter();
  if(name==='heatmap')renderHeatmap();
  if(name==='settings')renderSettings();
}
function toggleCard(i){if(openCards[i])delete openCards[i];else openCards[i]=true;renderCounter();}

function renderCounter(){
  updateHeaderStreak();
  var totalQ=data.fields.reduce(function(a,f){return a+f.total;},0);
  var solvedQ=data.fields.reduce(function(a,f){return a+totalSolved(f);},0);
  var todayQ=data.fields.reduce(function(a,f){return a+todayCount(f);},0);
  var avgP=data.fields.length?Math.round(data.fields.reduce(function(a,f){return a+progress(f);},0)/data.fields.length):0;
  var html='<div class="tab-pane">';
  html+='<div class="today-big"><div class="today-big-num">'+todayQ+'</div><div class="today-big-label">今日の解答数</div></div>';
  html+='<div class="metrics"><div class="mc"><div class="mc-label">平均進捗率</div><div class="mc-value">'+avgP+'%</div></div>'
    +'<div class="mc"><div class="mc-label">累計解答</div><div class="mc-value">'+solvedQ+'</div><div class="mc-sub">全'+totalQ+'問</div></div></div>';
  var goalContent='<div style="font-size:12px;color:var(--text3)">目標日を設定すると逆算できます</div>';
  if(data.goalDate){
    var n=new Date();n.setHours(0,0,0,0);
    var g=new Date(data.goalDate);g.setHours(0,0,0,0);
    var days=Math.max(0,Math.round((g-n)/864e5));
    var rem=Math.max(0,totalQ-solvedQ);
    var per=days>0?Math.ceil(rem/days):'—';
    goalContent='<div class="goal-stats">'
      +'<div class="gs-item"><div class="gs-val">'+days+'日</div><div class="gs-label">残り日数</div></div>'
      +'<div class="gs-item"><div class="gs-val">'+rem+'問</div><div class="gs-label">残り問題</div></div>'
      +'<div class="gs-item"><div class="gs-val">'+per+'問</div><div class="gs-label">1日の必要数</div></div>'
      +'</div>';
  }
  html+='<div class="goal-card"><div class="goal-row"><span class="goal-label">一周目標日</span>'
    +'<input class="goal-input" type="date" value="'+(data.goalDate||'')+'" onchange="data.goalDate=this.value;save();renderCounter()">'
    +'</div>'+goalContent+'</div>';
  html+='<div class="sec-label">分野別カウンター</div><div class="fields-grid">';
  data.fields.forEach(function(f,i){
    var c=todayCount(f);var p=progress(f);var lap=lapCount(f);var isOpen=!!openCards[i];
    var logs=f.logs||[];var recent=logs.slice(-10).reverse();
    var logHtml='';
    if(recent.length>0){
      logHtml+='<div class="fc-log-title">直近の操作ログ</div><div class="fc-log-list">';
      recent.forEach(function(log){
        var isPlus=log.delta>0;
        logHtml+='<div class="fc-log-item"><span class="fc-log-time">'+fmtTime(log.ts)+'</span>'
          +'<span class="fc-log-badge '+(isPlus?'plus':'minus')+'">'+(isPlus?'+':'−')+'</span>'
          +'<span class="fc-log-text">'+Math.abs(log.delta)+'問 → 計'+log.total+'問</span></div>';
      });
      logHtml+='</div>';
    }else{logHtml+='<div class="fc-log-title">ログはまだありません</div>';}
    html+='<div class="fc" onclick="toggleCard('+i+')">'
      +'<div class="fc-header"><span class="fc-name">'+f.name+'</span><span class="fc-arrow'+(isOpen?' open':'')+'">▾</span></div>'
      +'<div class="fc-lap">'+lap+'周目</div><div class="fc-goal-line">目標 '+f.dailyGoal+'問／日</div>'
      +'<div class="counter-row" onclick="event.stopPropagation()">'
      +'<button class="cnt-btn" onclick="increment('+i+',-1)">−</button>'
      +'<span class="cnt-num">'+c+'</span>'
      +'<button class="cnt-btn" onclick="increment('+i+',1)">＋</button>'
      +'</div>'
      +'<div class="fc-bar-bg"><div class="fc-bar-fill" style="width:'+p+'%"></div></div>'
      +'<div class="fc-detail'+(isOpen?' open':'')+'">'
      +'<div class="fc-detail-row"><span class="fc-detail-label">進捗率</span><span class="fc-detail-val">'+p+'%</span></div>'
      +'<div class="fc-detail-row"><span class="fc-detail-label">累計解答</span><span class="fc-detail-val">'+totalSolved(f)+' / '+f.total+'問</span></div>'
      +'<div class="fc-detail-row"><span class="fc-detail-label">既存解答数</span><span class="fc-detail-val">'+(f.prevSolved||0)+'問</span></div>'
      +(f.memo?'<div class="fc-memo">'+f.memo+'</div>':'')
      +logHtml+'</div></div>';
  });
  html+='</div></div>';
  document.getElementById('tab-counter').innerHTML=html;
}
function increment(i,delta){
  var t=todayStr();
  if(!data.fields[i].counts)data.fields[i].counts={};
  data.fields[i].counts[t]=Math.max(0,(data.fields[i].counts[t]||0)+delta);
  if(!data.fields[i].logs)data.fields[i].logs=[];
  data.fields[i].logs.push({ts:Date.now(),delta:delta,total:totalCounted(data.fields[i])});
  if(data.fields[i].logs.length>30)data.fields[i].logs=data.fields[i].logs.slice(-30);
  save();renderCounter();
}
function hmColor(ratio){
  if(ratio<=0)return HM_COLORS[0];
  return HM_COLORS[Math.min(HM_COLORS.length-1,Math.ceil(ratio*(HM_COLORS.length-1)))];
}
function renderHeatmap(){
  if(!data.fields.length){document.getElementById('tab-heatmap').innerHTML='<div class="tab-pane" style="padding:32px 16px;text-align:center;font-size:13px;color:var(--text3)">設定タブで分野を追加してください</div>';return;}
  if(hmFieldIdx>=data.fields.length)hmFieldIdx=0;
  var now2=new Date();var yr=now2.getFullYear(),mo=now2.getMonth();
  var todayKey=todayStr();var daysInMonth=new Date(yr,mo+1,0).getDate();var firstDow=new Date(yr,mo,1).getDay();
  var f=data.fields[hmFieldIdx];var counts=f.counts||{};
  var html='<div class="tab-pane"><div class="hm-wrap"><div class="hm-field-scroll">';
  data.fields.forEach(function(fd,i){html+='<button class="hm-fb'+(i===hmFieldIdx?' active':'')+'" onclick="hmFieldIdx='+i+';renderHeatmap()">'+fd.name+'</button>';});
  html+='</div><div class="hm-month-title">'+yr+'年 '+MONTHS[mo]+'</div><div class="hm-card">';
  html+='<div class="hm-dows">'+DOWS.map(function(d){return '<div class="hm-dow">'+d+'</div>';}).join('')+'</div><div class="hm-grid">';
  for(var e=0;e<firstDow;e++)html+='<div></div>';
  for(var d=1;d<=daysInMonth;d++){
    var key=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cnt=counts[key]||0;var ratio=f.dailyGoal>0?Math.min(1,cnt/f.dailyGoal):0;
    var isFuture=new Date(key+' 00:00:00')>now2;
    html+='<div class="hm-cell'+(key===todayKey?' today-cell':'')+'" style="background:'+hmColor(ratio)+';opacity:'+(isFuture?'0.3':'1')+'"></div>';
  }
  html+='</div><div class="hm-legend"><span>0問</span>';
  HM_COLORS.forEach(function(c){html+='<div class="hm-lc" style="background:'+c+'"></div>';});
  html+='<span>目標達成</span></div></div>';
  var monthTotal=0;
  for(var d2=1;d2<=daysInMonth;d2++){monthTotal+=(counts[yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0')]||0);}
  var monthTarget=f.dailyGoal*daysInMonth;var monthPct=monthTarget>0?Math.round(monthTotal/monthTarget*100):0;
  html+='<div style="margin-top:12px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">'
    +'<div><div style="font-size:19px;font-weight:600;color:var(--text)">'+monthTotal+'</div><div style="font-size:10px;color:var(--text3);margin-top:2px">今月の解答数</div></div>'
    +'<div><div style="font-size:19px;font-weight:600;color:var(--text)">'+monthTarget+'</div><div style="font-size:10px;color:var(--text3);margin-top:2px">今月の目標数</div></div>'
    +'<div><div style="font-size:19px;font-weight:600;color:var(--accent)">'+monthPct+'%</div><div style="font-size:10px;color:var(--text3);margin-top:2px">達成率</div></div>'
    +'</div></div></div>';
  document.getElementById('tab-heatmap').innerHTML=html;
}
function renderSettings(){
  var html='<div class="tab-pane">';
  if(currentUser){
    var name=currentUser.user_metadata&&currentUser.user_metadata.name?currentUser.user_metadata.name:'ログイン中';
    html+='<div class="logout-card"><span class="logout-user">☁ '+name+'</span>'
      +'<button class="logout-btn" onclick="doLogout()">ログアウト</button></div>';
  }
  html+='<div class="sec-label">分野の設定</div><div class="settings-list">';
  data.fields.forEach(function(f,i){
    var p=progress(f);var lap=lapCount(f);
    html+='<div class="sc"><div class="sc-head">'
      +'<input class="sc-name-input" type="text" value="'+f.name+'" onchange="updF('+i+',\'name\',this.value)" placeholder="分野名">'
      +'<button class="sc-del" onclick="removeField('+i+')">削除</button></div>'
      +'<div class="sc-fields">'
      +'<div class="sc-field"><span class="sc-fl">全体問題数</span><input class="sc-input" type="number" min="0" value="'+f.total+'" onchange="updF('+i+',\'total\',this.value)"></div>'
      +'<div class="sc-field"><span class="sc-fl">1日目標</span><input class="sc-input" type="number" min="0" value="'+f.dailyGoal+'" onchange="updF('+i+',\'dailyGoal\',this.value)"></div>'
      +'<div class="sc-field"><span class="sc-fl">既存の解答数</span><input class="sc-input" type="number" min="0" value="'+(f.prevSolved||0)+'" onchange="updF('+i+',\'prevSolved\',this.value)"></div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'
      +'<div class="sc-field"><span class="sc-fl">進捗率（自動）</span><div class="sc-mastery">'+p+'%</div></div>'
      +'<div class="sc-field"><span class="sc-fl">周回数（自動）</span><div class="sc-mastery">'+lap+'周目</div></div>'
      +'</div>'
      +'<textarea class="sc-textarea" placeholder="メモ..." onchange="updF('+i+',\'memo\',this.value)">'+(f.memo||'')+'</textarea>'
      +'</div>';
  });
  html+='</div><div class="add-field-card"><input type="text" id="new-name" placeholder="新しい分野名...">'
    +'<button class="btn-add" onclick="addField()">追加</button></div>';
  html+='<div class="sec-label">データ管理</div>'
    +'<div class="data-card"><button class="btn-io" onclick="exportData()">書き出す（JSON）</button>'
    +'<label class="btn-io" style="cursor:pointer">読み込む（JSON）<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label></div>';
  html+='<div class="hint-card"><b>iPhoneでホーム画面に追加する方法</b><br>Safari でこのページを開く → 下部の共有ボタン（□↑）→「ホーム画面に追加」→「追加」</div>';
  html+='</div>';
  document.getElementById('tab-settings').innerHTML=html;
}
function doLogout(){if(confirm('ログアウトしますか？'))sb.auth.signOut();}
function updF(i,key,val){
  if(key==='total'||key==='dailyGoal'||key==='prevSolved')val=parseInt(val)||0;
  data.fields[i][key]=val;save();if(key==='name')renderCounter();
}
function removeField(i){
  if(!confirm('「'+data.fields[i].name+'」を削除しますか？'))return;
  data.fields.splice(i,1);delete openCards[i];
  if(hmFieldIdx>=data.fields.length)hmFieldIdx=Math.max(0,data.fields.length-1);
  save();renderSettings();
}
function addField(){
  var inp=document.getElementById('new-name');var name=inp.value.trim();if(!name)return;
  data.fields.push({name:name,total:100,dailyGoal:10,prevSolved:0,memo:'',counts:{},logs:[]});
  inp.value='';save();renderSettings();
}
function exportData(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='study_tracker_data.json';a.click();
}
function importData(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{data=JSON.parse(ev.target.result);save();renderSettings();alert('読み込みました！');}
    catch(err){alert('ファイルが読み込めませんでした');}
  };
  reader.readAsText(file);
}
initAuth();
</script>
