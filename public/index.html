<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Tracker">
<meta name="theme-color" content="#FAF7F3">
<title>Study Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#faf7f3;--surface:#ffffff;--border:#e8e1da;--border2:#ddd6ce;
  --text:#4a3e36;--text2:#7b6a60;--text3:#a69a90;
  --accent:#c07a5a;--accent-light:#f5ede9;--accent-mid:#d4957a;
  --nav-h:72px;--radius:10px;--radius-sm:7px;--radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}

/* ── ログイン画面 ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px}
.login-logo{margin-bottom:12px}
.login-title{font-size:24px;font-weight:700;color:var(--text);letter-spacing:.01em;margin-bottom:8px;text-align:center}
.login-sub{font-size:14px;color:var(--text3);text-align:center;line-height:1.6;margin-bottom:48px}
.login-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:28px 24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--surface);font-size:14px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit}
.login-divider{display:flex;align-items:center;gap:10px;color:var(--text3);font-size:12px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:0.5px;background:var(--border)}
.skip-btn{padding:11px;border:none;background:transparent;font-size:13px;color:var(--text3);cursor:pointer;font-family:inherit;text-align:center}
.login-note{font-size:11px;color:var(--text3);text-align:center;line-height:1.6}

/* ── メインアプリ ── */
#main-screen{display:none}
.app{max-width:480px;margin:0 auto;padding:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px));min-height:100vh}
.header{padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 0;margin-bottom:20px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left h1{font-size:17px;font-weight:600;letter-spacing:.01em;color:var(--text)}
.header-left p{font-size:12px;color:var(--text3);margin-top:3px}
.header-streak{display:flex;align-items:center;gap:5px;background:var(--accent-light);border:0.5px solid var(--accent-mid);border-radius:99px;padding:5px 12px;flex-shrink:0}
.header-streak-num{font-size:16px;font-weight:700;color:var(--accent);line-height:1}
.header-streak-label{font-size:11px;color:var(--accent);white-space:nowrap}
.sync-badge{font-size:10px;color:var(--text3);padding:0 16px;margin-bottom:6px;min-height:18px}

/* ── ボトムナビ ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:rgba(250,247,243,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:0.5px solid var(--border);display:flex;align-items:flex-start;z-index:100}
.nav-btn{flex:1;height:var(--nav-h);border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text3);font-family:inherit;position:relative;transition:color .2s;padding:10px 0;}
.nav-btn.active{color:var(--accent)}
.nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.nav-btn.active .nav-icon{transform:scale(1.12)}
.nav-label{font-size:10px;letter-spacing:.02em;color:var(--text3);transition:color .2s}
.nav-btn.active .nav-label{color:var(--accent)}
.nav-btn:not(.active) .nav-label{opacity:.6}
.nav-btn::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .2s}
.nav-btn.active::after{opacity:1}

/* ── 共通カード ── */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;margin-bottom:16px}
.mc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 12px 10px}
.mc-label{font-size:10px;color:var(--text3);margin-bottom:5px;letter-spacing:.02em}
.mc-value{font-size:19px;font-weight:600;color:var(--text);line-height:1}
.mc-sub{font-size:10px;color:var(--text3);margin-top:3px}
.today-big{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:18px 16px;margin:0 16px 16px;text-align:center}
.today-big-num{font-size:64px;font-weight:700;color:var(--accent);line-height:1}
.today-big-label{font-size:12px;color:var(--text3);margin-top:6px}
.goal-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px}
.goal-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.goal-label{font-size:13px;color:var(--text);font-weight:500;flex:1}
.goal-input{padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);-webkit-appearance:none;font-family:inherit}
.goal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gs-item{text-align:center}
.gs-val{font-size:16px;font-weight:600;color:var(--text)}
.gs-label{font-size:10px;color:var(--text3);margin-top:2px}
.sec-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text3);padding:0 16px;margin-bottom:8px}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:16px}
.fc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 14px 12px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.fc:active{border-color:var(--accent-mid)}
.fc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fc-name{font-size:13px;font-weight:600;color:var(--text)}
.fc-arrow{font-size:11px;color:var(--text3);transition:transform .2s}
.fc-arrow.open{transform:rotate(180deg)}
.fc-lap{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:3px}
.fc-goal-line{font-size:11px;color:var(--text3);margin-bottom:8px}
.counter-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.cnt-btn{width:36px;height:36px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cnt-btn:active{background:var(--accent-light);transform:scale(.93)}
.cnt-num{font-size:24px;font-weight:700;color:var(--text);flex:1;text-align:center;line-height:1}
.fc-bar-bg{height:5px;background:var(--accent-light);border-radius:99px;overflow:hidden}
.fc-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.fc-detail{margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);display:none;flex-direction:column;gap:8px}
.fc-detail.open{display:flex}
.fc-detail-row{display:flex;justify-content:space-between;align-items:center}
.fc-detail-label{font-size:11px;color:var(--text3)}
.fc-detail-val{font-size:12px;font-weight:600;color:var(--text)}
.fc-memo{font-size:11px;color:var(--text2);font-style:italic}
.fc-log-title{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--text3);margin-top:2px}
.fc-log-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.fc-log-item{display:flex;align-items:center;gap:6px;font-size:11px}
.fc-log-time{color:var(--text3);white-space:nowrap;flex-shrink:0}
.fc-log-badge{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.fc-log-badge.plus{background:var(--accent-light);color:var(--accent)}
.fc-log-badge.minus{background:#f1ede8;color:var(--text3)}
.fc-log-text{color:var(--text2)}

/* ── ヒートマップ ── */
.hm-outer{padding:0 16px;margin-bottom:16px}
.hm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hm-month-title{font-size:14px;font-weight:600;color:var(--text)}
.hm-streak-badge{display:flex;align-items:center;gap:5px;background:var(--accent-light);border:0.5px solid var(--accent-mid);border-radius:99px;padding:4px 10px}
.hm-streak-num{font-size:13px;font-weight:700;color:var(--accent)}
.hm-streak-label{font-size:11px;color:var(--accent)}
.hm-field-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.hm-field-scroll::-webkit-scrollbar{display:none}
.hm-fb{padding:5px 14px;border-radius:99px;border:0.5px solid var(--border2);background:var(--surface);font-size:12px;cursor:pointer;color:var(--text2);white-space:nowrap;font-family:inherit}
.hm-fb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hm-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.hm-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.hm-dow{font-size:9px;color:var(--text3);text-align:center}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm-cell{aspect-ratio:1;border-radius:5px;cursor:pointer;transition:transform .12s}
.hm-cell:active{transform:scale(.88)}
.hm-cell.today-cell{outline:2px solid var(--accent);outline-offset:1px}
.hm-legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:10px;color:var(--text3)}
.hm-lc{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.hm-summary{margin-top:12px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.hm-sum-val{font-size:19px;font-weight:600;color:var(--text)}
.hm-sum-label{font-size:10px;color:var(--text3);margin-top:2px}

/* ── 日付モーダル ── */
.day-modal-bg{position:fixed;inset:0;background:rgba(74,62,54,0.3);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:bgFadeIn .2s ease}
@keyframes bgFadeIn{from{opacity:0}to{opacity:1}}
.day-modal{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;animation:slideUp .22s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.day-modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 16px}
.day-modal-date{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px}
.day-modal-total{font-size:13px;color:var(--text2);margin-bottom:16px}
.day-modal-breakdown{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.day-modal-row{display:flex;align-items:center;justify-content:space-between}
.day-modal-field{font-size:13px;color:var(--text2)}
.day-modal-count{font-size:13px;font-weight:600;color:var(--text)}
.day-modal-bar-bg{height:4px;background:var(--accent-light);border-radius:99px;overflow:hidden;flex:1;margin:0 10px}
.day-modal-bar-fill{height:100%;border-radius:99px;background:var(--accent)}
.day-modal-close{width:100%;padding:12px;border:none;background:var(--bg);border-radius:var(--radius-sm);font-size:14px;color:var(--text2);cursor:pointer;font-family:inherit}

/* ── 実績 ── */
.ach-header{padding:0 16px;margin-bottom:12px}
.ach-summary{display:flex;align-items:center;gap:8px;margin-top:4px}
.ach-summary-text{font-size:13px;color:var(--text2)}
.ach-summary-bar-bg{flex:1;height:6px;background:var(--accent-light);border-radius:99px;overflow:hidden}
.ach-summary-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:16px}
.ach-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.ach-card.unlocked{border-color:var(--accent-mid)}
.ach-card.locked{opacity:.5}
.ach-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.ach-name{font-size:12px;font-weight:600;color:var(--text)}
.ach-desc{font-size:10px;color:var(--text3);line-height:1.4}
.ach-badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:99px;margin-top:2px}
.ach-badge.unlocked{background:var(--accent-light);color:var(--accent)}
.ach-badge.locked{background:var(--bg);color:var(--text3);border:0.5px solid var(--border)}

/* 実績通知 */
.ach-toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);background:var(--surface);border:0.5px solid var(--accent-mid);border-radius:var(--radius-lg);padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);z-index:300;box-shadow:0 4px 16px rgba(74,62,54,.12);white-space:nowrap;animation:toastIn .3s cubic-bezier(.34,1.2,.64,1)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── 設定 ── */
.settings-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.sc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.sc-head{display:flex;align-items:center;margin-bottom:10px;gap:8px}
.sc-name-input{flex:1;padding:5px 8px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-weight:600;background:var(--bg);color:var(--text);font-family:inherit}
.sc-del{font-size:12px;color:var(--accent);border:0.5px solid #e8c4b0;border-radius:6px;padding:3px 8px;background:transparent;cursor:pointer;font-family:inherit;white-space:nowrap}
.sc-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.sc-field{display:flex;flex-direction:column;gap:4px}
.sc-fl{font-size:10px;color:var(--text3)}
.sc-input{padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);width:100%;font-family:inherit}
.sc-mastery{font-size:13px;font-weight:600;color:var(--accent);padding:6px 8px;background:var(--accent-light);border-radius:var(--radius-sm);text-align:center}
.sc-textarea{width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:12px;resize:none;min-height:52px;background:var(--bg);color:var(--text);font-family:inherit}
.add-field-card{background:var(--accent-light);border:0.5px dashed var(--accent-mid);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px;display:flex;gap:8px;align-items:center}
.add-field-card input{flex:1;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);font-family:inherit}
.btn-add{padding:8px 16px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.logout-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px;display:flex;align-items:center;justify-content:space-between}
.logout-user{font-size:13px;color:var(--text2)}
.logout-btn{padding:7px 14px;border-radius:var(--radius-sm);border:0.5px solid #e8c4b0;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;font-family:inherit}
.data-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 10px;display:flex;gap:8px;flex-wrap:wrap}
.btn-io{flex:1;padding:9px 12px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);font-size:12px;cursor:pointer;text-align:center;min-width:100px;font-family:inherit}
.hint-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px;font-size:12px;color:var(--text2);line-height:1.7}
.hint-card b{color:var(--text);font-weight:600}
.tab-pane{animation:tabFade .18s ease}
@keyframes tabFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="login-logo">
    <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
      <rect width="56" height="56" rx="14" fill="#f5ede9"/>
      <rect x="10.75" y="18.75" width="14.5" height="18.5" rx="4.25" stroke="#c07a5a" stroke-width="1.8"/>
      <line x1="14" y1="28" x2="22" y2="28" stroke="#c07a5a" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="30.75" y="18.75" width="14.5" height="18.5" rx="4.25" stroke="#c07a5a" stroke-width="1.8"/>
      <line x1="34" y1="28" x2="42" y2="28" stroke="#c07a5a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="38" y1="24" x2="38" y2="32" stroke="#c07a5a" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="login-title">Study Tracker</div>
  <div class="login-sub">資格試験の学習進捗を<br>記録・管理するアプリです</div>
  <div class="login-card">
    <button class="google-btn" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Googleでログイン
    </button>
    <div class="login-divider">または</div>
    <button class="skip-btn" onclick="skipLogin()">ログインせずに使う</button>
    <div class="login-note">ログインするとデータがクラウドに保存され<br>複数デバイスで使えます</div>
  </div>
</div>

<!-- メインアプリ -->
<div id="main-screen">
  <div class="app">
    <div class="header">
      <div class="header-row">
        <div class="header-left">
          <h1>Study Tracker</h1>
          <p id="header-date"></p>
        </div>
        <div class="header-streak">
          <span class="header-streak-num" id="streak-num">0</span>
          <span class="header-streak-label">日連続</span>
        </div>
      </div>
    </div>
    <div class="sync-badge" id="sync-status"></div>
    <div id="tab-counter"></div>
    <div id="tab-heatmap" style="display:none"></div>
    <div id="tab-achievements" style="display:none"></div>
    <div id="tab-settings" style="display:none"></div>
    <nav class="nav">

async function initAuth(){
  // 1. まずSupabase標準のlocalStorageからセッション復元を試みる
  var sessionRes=await sb.auth.getSession();
  var session=sessionRes.data&&sessionRes.data.session?sessionRes.data.session:null;

  if(session){
    // localStorageにセッションあり → サーバーのCookieにも保存
    currentUser=session.user;
    await saveSessionToServer(session);
    await migrateLocalToCloud();
    var loaded=await loadFromCloud();
    if(loaded)showSync('☁ クラウドから読み込みました');
    showMainScreen();
    return;
  }

  // 2. localStorageになければサーバーのHttpOnly Cookieを確認（PWA対応）
  var serverUser=await getUserFromServer();
  if(serverUser){
    currentUser=serverUser;
    await migrateLocalToCloud();
    var loaded2=await loadFromCloud();
    if(loaded2)showSync('☁ クラウドから読み込みました');
    showMainScreen();
    return;
  }

  // 3. どちらもなければログイン画面
  showLoginScreen();

  // 認証状態の変化を監視
  sb.auth.onAuthStateChange(async function(event,session){
    if(event==='SIGNED_IN'&&session){
      currentUser=session.user;
      // HttpOnly CookieにセッションをセットしてPWAでも維持
      await saveSessionToServer(session);
      await migrateLocalToCloud();
      var loaded=await loadFromCloud();
      if(loaded)showSync('☁ クラウドから読み込みました');
      showMainScreen();
    }else if(event==='SIGNED_OUT'){
      currentUser=null;
      await logoutFromServer();
      data=loadLocal();
      showLoginScreen();
    }else if(event==='TOKEN_REFRESHED'&&session){
      currentUser=session.user;
      await saveSessionToServer(session);
    }
  });
}

var nowD=new Date();
document.getElementById('header-date').textContent=nowD.getFullYear()+'年'+(nowD.getMonth()+1)+'月'+nowD.getDate()+'日（'+DOWS[nowD.getDay()]+'）';

function todayStr(){return new Date().toISOString().slice(0,10);}
function totalCounted(f){var s=0;Object.keys(f.counts||{}).forEach(function(k){s+=f.counts[k];});return s;}
function totalSolved(f){return (f.prevSolved||0)+totalCounted(f);}
function progress(f){return f.total>0?Math.min(100,Math.round(totalSolved(f)/f.total*100)):0;}
function lapCount(f){return f.total>0?Math.floor(totalSolved(f)/f.total)+1:1;}
function todayCount(f){return(f.counts||{})[todayStr()]||0;}

function calcStreak(){
  var allDates={};data.fields.forEach(function(f){Object.keys(f.counts||{}).forEach(function(k){if(f.counts[k]>0)allDates[k]=true;});});
  var streak=0;var d=new Date();if(!allDates[todayStr()])d.setDate(d.getDate()-1);
  while(true){var key=d.toISOString().slice(0,10);if(!allDates[key])break;streak++;d.setDate(d.getDate()-1);}
  return streak;
}
function updateHeaderStreak(){var el=document.getElementById('streak-num');if(el)el.textContent=calcStreak();}

function calcStats(){
  var totalS=data.fields.reduce(function(a,f){return a+totalSolved(f);},0);
  var streak=calcStreak();
  var maxLap=data.fields.reduce(function(a,f){return Math.max(a,lapCount(f));},1);
  var minProg=data.fields.length?data.fields.reduce(function(a,f){return Math.min(a,progress(f));},100):0;
  var now2=new Date();var yr=now2.getFullYear(),mo=now2.getMonth();
  var daysInMonth=new Date(yr,mo+1,0).getDate();
  var thisMonthDays=0;
  var allDates={};data.fields.forEach(function(f){Object.keys(f.counts||{}).forEach(function(k){if(f.counts[k]>0)allDates[k]=true;});});
  for(var d=1;d<=daysInMonth;d++){var key=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(allDates[key])thisMonthDays++;}
  // perfectDays: 連続で全分野目標達成した日数
  var perfectDays=0;var pd=new Date();
  for(var i=0;i<365;i++){
    var pkey=pd.toISOString().slice(0,10);
    var allMet=data.fields.every(function(f){return (f.counts[pkey]||0)>=f.dailyGoal;});
    if(allMet&&data.fields.length>0){perfectDays++;pd.setDate(pd.getDate()-1);}else break;
  }
  return{totalSolved:totalS,streak:streak,maxLap:maxLap,minProgress:minProg,thisMonthDays:thisMonthDays,perfectDays:perfectDays};
}

function checkAchievements(){
  var stats=calcStats();
  var newlyUnlocked=[];
  ACHIEVEMENTS.forEach(function(ach){
    if(data.unlockedAchievements.indexOf(ach.id)===-1&&ach.check(data,stats)){
      data.unlockedAchievements.push(ach.id);
      newlyUnlocked.push(ach);
    }
  });
  if(newlyUnlocked.length>0){
    saveLocal(data);
    newlyUnlocked.forEach(function(ach,i){
      setTimeout(function(){showAchToast(ach);},i*1800);
    });
  }
}

function showAchToast(ach){
  var el=document.createElement('div');
  el.className='ach-toast';
  el.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> <strong>実績達成！</strong>'+ach.name;
  document.body.appendChild(el);
  setTimeout(function(){
    el.style.opacity='0';el.style.transition='opacity .3s';
    setTimeout(function(){el.remove();},400);
  },2800);
}

function fmtTime(ts){var d=new Date(ts);var h=String(d.getHours()).padStart(2,'0');var m=String(d.getMinutes()).padStart(2,'0');if(d.toDateString()===new Date().toDateString())return h+':'+m;return (d.getMonth()+1)+'/'+d.getDate()+' '+h+':'+m;}

function showTab(name){
  openCards={};currentTab=name;
  ['counter','heatmap','achievements','settings'].forEach(function(t){
    document.getElementById('tab-'+t).style.display=t===name?'':'none';
    document.getElementById('nav-'+t).classList.toggle('active',t===name);
  });
  if(name==='counter')renderCounter();
  if(name==='heatmap')renderHeatmap();
  if(name==='achievements')renderAchievements();
  if(name==='settings')renderSettings();
}
function toggleCard(i){if(openCards[i])delete openCards[i];else openCards[i]=true;renderCounter();}

function renderCounter(){
  updateHeaderStreak();
  var totalQ=data.fields.reduce(function(a,f){return a+f.total;},0);
  var solvedQ=data.fields.reduce(function(a,f){return a+totalSolved(f);},0);
  var todayQ=data.fields.reduce(function(a,f){return a+todayCount(f);},0);
  var avgP=data.fields.length?Math.round(data.fields.reduce(function(a,f){return a+progress(f);},0)/data.fields.length):0;

  var html='<div class="tab-pane">';

  // ── 主役：今日の解答数 ──
  html+='<div style="margin:4px 16px 12px;padding:40px 24px 36px;text-align:center;">'
    +'<div style="font-size:11px;letter-spacing:.14em;color:var(--text3);margin-bottom:14px;text-transform:uppercase;">今日の解答数</div>'
    +'<div style="font-size:96px;font-weight:700;color:var(--accent);line-height:.9;letter-spacing:-.03em;">'+todayQ+'</div>'
    +'</div>';

  // ── 締切カード（残り日数を主役に）──
  if(data.goalDate){
    var n=new Date();n.setHours(0,0,0,0);
    var g=new Date(data.goalDate);g.setHours(0,0,0,0);
    var days=Math.max(0,Math.round((g-n)/864e5));
    var rem=Math.max(0,totalQ-solvedQ);
    var gm=g.getMonth()+1,gd=g.getDate();
    html+='<div style="margin:0 16px 10px;background:var(--surface);border:0.5px solid var(--border);border-radius:18px;padding:22px 20px;">'
      +'<div style="display:flex;align-items:baseline;justify-content:center;gap:4px;margin-bottom:14px;">'
      +'<span style="font-size:13px;color:var(--text3);">残り</span>'
      +'<span style="font-size:48px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-.02em;">'+days+'</span>'
      +'<span style="font-size:15px;color:var(--text2);font-weight:500;">日</span>'
      +'</div>'
      +'<div style="display:flex;align-items:center;justify-content:center;gap:16px;">'
      +'<span style="font-size:12px;color:var(--text2);">残り '+rem+'問</span>'
      +'<span style="width:3px;height:3px;border-radius:50%;background:var(--border2);"></span>'
      +'<span style="font-size:12px;color:var(--text2);">目標 '+gm+'/'+gd+'</span>'
      +'</div>'
      +'</div>';
  }else{
    html+='<div style="margin:0 16px 10px;background:var(--surface);border:0.5px solid var(--border);border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;">'
      +'<span style="font-size:13px;color:var(--text3);">目標日を設定</span>'
      +'<input class="goal-input" type="date" value="" onchange="data.goalDate=this.value;save();renderCounter()" style="font-size:13px;">'
      +'</div>';
  }
  if(data.goalDate){
    html+='<div style="text-align:center;margin:0 16px 18px;"><input type="date" value="'+data.goalDate+'" onchange="data.goalDate=this.value;save();renderCounter()" style="font-size:11px;color:var(--text3);border:none;background:transparent;"></div>';
  }

  // ── 補助：進捗率＋累計を1枚に統合 ──
  html+='<div style="margin:0 16px 22px;background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;">'
    +'<div style="flex:1;"><div style="font-size:11px;color:var(--text3);margin-bottom:4px;">平均進捗率</div><div style="font-size:20px;font-weight:600;color:var(--text2);">'+avgP+'<span style="font-size:12px;font-weight:400;">%</span></div></div>'
    +'<div style="width:0.5px;height:32px;background:var(--border);"></div>'
    +'<div style="flex:1;text-align:right;"><div style="font-size:11px;color:var(--text3);margin-bottom:4px;">累計解答</div><div style="font-size:20px;font-weight:600;color:var(--text2);">'+solvedQ+'<span style="font-size:12px;font-weight:400;color:var(--text3);"> / '+totalQ+'</span></div></div>'
    +'</div>';

  // ── 分野別カウンター ──
  html+='<div class="sec-label">分野別カウンター</div><div class="fields-grid">';
  data.fields.forEach(function(f,i){
    var c=todayCount(f);var p=progress(f);var lap=lapCount(f);var isOpen=!!openCards[i];
    var logs=f.logs||[];var recent=logs.slice(-10).reverse();
    var logHtml='';
    if(recent.length>0){
      logHtml+='<div class="fc-log-title">直近の操作ログ</div><div class="fc-log-list">';
      recent.forEach(function(log){var isPlus=log.delta>0;logHtml+='<div class="fc-log-item"><span class="fc-log-time">'+fmtTime(log.ts)+'</span><span class="fc-log-badge '+(isPlus?'plus':'minus')+'">'+(isPlus?'+':'−')+'</span><span class="fc-log-text">'+Math.abs(log.delta)+'問 → 計'+log.total+'問</span></div>';});
      logHtml+='</div>';
    }else{logHtml+='<div class="fc-log-title">ログはまだありません</div>';}
    html+='<div class="fc" onclick="toggleCard('+i+')">'
      +'<div class="fc-header"><span class="fc-name">'+f.name+'</span><span class="fc-arrow'+(isOpen?' open':'')+'">▾</span></div>'
      +'<div class="fc-lap">'+lap+'周目</div>'
      +'<div class="counter-row" onclick="event.stopPropagation()"><button class="cnt-btn" onclick="increment('+i+',-1)">−</button><span class="cnt-num">'+c+'</span><button class="cnt-btn" onclick="increment('+i+',1)">＋</button></div>'
      +'<div style="font-size:10px;color:var(--text3);text-align:center;margin-bottom:8px;">目標 '+f.dailyGoal+'問／日</div>'
      +'<div class="fc-bar-bg"><div class="fc-bar-fill" style="width:'+p+'%"></div></div>'
      +'<div class="fc-detail'+(isOpen?' open':'')+'">'
      +'<div class="fc-detail-row"><span class="fc-detail-label">進捗率</span><span class="fc-detail-val">'+p+'%</span></div>'
      +'<div class="fc-detail-row"><span class="fc-detail-label">累計解答</span><span class="fc-detail-val">'+totalSolved(f)+' / '+f.total+'問</span></div>'
      +'<div class="fc-detail-row"><span class="fc-detail-label">既存解答数</span><span class="fc-detail-val">'+(f.prevSolved||0)+'問</span></div>'
      +(f.memo?'<div class="fc-memo">'+f.memo+'</div>':'')
      +logHtml+'</div></div>';
  });
  html+='</div></div>';
  document.getElementById('tab-counter').innerHTML=html;
}

function increment(i,delta){
  var t=todayStr();if(!data.fields[i].counts)data.fields[i].counts={};
  data.fields[i].counts[t]=Math.max(0,(data.fields[i].counts[t]||0)+delta);
  if(!data.fields[i].logs)data.fields[i].logs=[];
  data.fields[i].logs.push({ts:Date.now(),delta:delta,total:totalCounted(data.fields[i])});
  if(data.fields[i].logs.length>30)data.fields[i].logs=data.fields[i].logs.slice(-30);
  save();renderCounter();
}

// ── ヒートマップ ──
function hmColorForCount(cnt){
  if(cnt===0)return HM_COLORS[0];
  if(cnt<=20)return HM_COLORS[1];
  if(cnt<=50)return HM_COLORS[2];
  if(cnt<=100)return HM_COLORS[3];
  return HM_COLORS[4];
}

function renderHeatmap(){
  var now2=new Date();var yr=now2.getFullYear(),mo=now2.getMonth();
  var todayKey=todayStr();var daysInMonth=new Date(yr,mo+1,0).getDate();var firstDow=new Date(yr,mo,1).getDay();
  var streak=calcStreak();

  // 全分野合計カウントを日付ごとに集計
  function getDayCounts(fieldIdx){
    var counts={};
    if(fieldIdx===-1){
      data.fields.forEach(function(f){Object.keys(f.counts||{}).forEach(function(k){counts[k]=(counts[k]||0)+(f.counts[k]||0);});});
    }else if(data.fields[fieldIdx]){
      counts=data.fields[fieldIdx].counts||{};
    }
    return counts;
  }

  var counts=getDayCounts(hmFieldIdx);

  var html='<div class="tab-pane"><div class="hm-outer">';
  html+='<div class="hm-top"><div class="hm-month-title">'+yr+'年 '+MONTHS[mo]+'</div>';
  html+='<div class="hm-streak-badge"><span class="hm-streak-num">'+streak+'日</span><span class="hm-streak-label">連続！</span></div></div>';

  // 分野セレクター（全分野＋各分野）
  html+='<div class="hm-field-scroll">';
  html+='<button class="hm-fb'+(hmFieldIdx===-1?' active':'')+'" onclick="hmFieldIdx=-1;renderHeatmap()">全分野</button>';
  data.fields.forEach(function(fd,i){html+='<button class="hm-fb'+(i===hmFieldIdx?' active':'')+'" onclick="hmFieldIdx='+i+';renderHeatmap()">'+fd.name+'</button>';});
  html+='</div>';

  html+='<div class="hm-card"><div class="hm-dows">'+DOWS.map(function(d){return '<div class="hm-dow">'+d+'</div>';}).join('')+'</div>';
  html+='<div class="hm-grid">';
  for(var e=0;e<firstDow;e++)html+='<div></div>';
  for(var d=1;d<=daysInMonth;d++){
    var key=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cnt=counts[key]||0;
    var isFuture=new Date(key+' 00:00:00')>now2;
    var isToday=key===todayKey;
    var col=isFuture?HM_COLORS[0]:hmColorForCount(cnt);
    var op=isFuture?'0.3':'1';
    html+='<div class="hm-cell'+(isToday?' today-cell':'')+'" style="background:'+col+';opacity:'+op+'" onclick="openDayModal(\''+key+'\')" data-date="'+key+'"></div>';
  }
  html+='</div>';
  html+='<div class="hm-legend"><span>少</span>';
  HM_COLORS.forEach(function(c){html+='<div class="hm-lc" style="background:'+c+'"></div>';});
  html+='<span>多</span></div></div>';

  // 月間サマリー
  var monthTotal=0;
  for(var d2=1;d2<=daysInMonth;d2++){var k2=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');monthTotal+=(counts[k2]||0);}
  var activeDays=0;
  for(var d3=1;d3<=daysInMonth;d3++){var k3=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d3).padStart(2,'0');if((counts[k3]||0)>0)activeDays++;}
  html+='<div class="hm-summary"><div><div class="hm-sum-val">'+monthTotal+'</div><div class="hm-sum-label">今月の解答数</div></div><div><div class="hm-sum-val">'+activeDays+'</div><div class="hm-sum-label">記録した日数</div></div><div><div class="hm-sum-val">'+streak+'</div><div class="hm-sum-label">連続日数</div></div></div>';
  html+='</div></div>';
  document.getElementById('tab-heatmap').innerHTML=html;
}

function openDayModal(dateKey){
  var parts=dateKey.split('-');
  var yr=parseInt(parts[0]),mo=parseInt(parts[1]),dy=parseInt(parts[2]);
  var dateLabel=yr+'年'+mo+'月'+dy+'日（'+DOWS[new Date(dateKey).getDay()]+'）';
  var totalCnt=0;
  var breakdown=data.fields.map(function(f){var c=(f.counts[dateKey]||0);totalCnt+=c;return{name:f.name,count:c};});
  var maxCount=Math.max.apply(null,breakdown.map(function(b){return b.count;}));
  var html='<div class="day-modal-bg" onclick="closeDayModal()">'
    +'<div class="day-modal" onclick="event.stopPropagation()">'
    +'<div class="day-modal-handle"></div>'
    +'<div class="day-modal-date">'+dateLabel+'</div>'
    +'<div class="day-modal-total">合計 '+totalCnt+'問</div>'
    +'<div class="day-modal-breakdown">';
  breakdown.forEach(function(b){
    var pct=maxCount>0?Math.round(b.count/maxCount*100):0;
    html+='<div class="day-modal-row"><span class="day-modal-field">'+b.name+'</span>'
      +'<div class="day-modal-bar-bg"><div class="day-modal-bar-fill" style="width:'+pct+'%"></div></div>'
      +'<span class="day-modal-count">'+b.count+'問</span></div>';
  });
  html+='</div><button class="day-modal-close" onclick="closeDayModal()">閉じる</button></div></div>';
  var el=document.getElementById('day-modal');
  el.innerHTML=html;el.style.display='block';
}
function closeDayModal(){var el=document.getElementById('day-modal');el.style.display='none';el.innerHTML='';}

// ── 実績 ──
function renderAchievements(){
  var stats=calcStats();
  var unlocked=data.unlockedAchievements||[];
  var unlockedCount=0;
  ACHIEVEMENTS.forEach(function(a){if(unlocked.indexOf(a.id)!==-1)unlockedCount++;});
  var pct=Math.round(unlockedCount/ACHIEVEMENTS.length*100);

  var html='<div class="tab-pane">';
  html+='<div class="ach-header"><div class="sec-label" style="padding:0;margin-bottom:6px">実績</div>'
    +'<div class="ach-summary"><span class="ach-summary-text">'+unlockedCount+' / '+ACHIEVEMENTS.length+'</span>'
    +'<div class="ach-summary-bar-bg"><div class="ach-summary-bar-fill" style="width:'+pct+'%"></div></div>'
    +'<span class="ach-summary-text">'+pct+'%</span></div></div>';

  html+='<div class="ach-grid">';
  ACHIEVEMENTS.forEach(function(ach){
    var isUnlocked=unlocked.indexOf(ach.id)!==-1;
    var iconColor=isUnlocked?'var(--accent)':'var(--text3)';
    html+='<div class="ach-card '+(isUnlocked?'unlocked':'locked')+'">'
      +'<div class="ach-icon" style="color:'+iconColor+'">'+ACH_ICONS[ach.id]+'</div>'
      +'<div class="ach-name">'+ach.name+'</div>'
      +'<div class="ach-desc">'+ach.desc+'</div>'
      +'<span class="ach-badge '+(isUnlocked?'unlocked':'locked')+'">'+(isUnlocked?'達成':'未達成')+'</span>'
      +'</div>';
  });
  html+='</div></div>';
  document.getElementById('tab-achievements').innerHTML=html;
}

// ── 設定 ──
function renderSettings(){
  var html='<div class="tab-pane">';
  if(currentUser){var name=currentUser.user_metadata&&currentUser.user_metadata.name?currentUser.user_metadata.name:'ログイン中';html+='<div class="logout-card"><span class="logout-user">☁ '+name+'</span><button class="logout-btn" onclick="doLogout()">ログアウト</button></div>';}
  html+='<div class="sec-label">分野の設定</div><div class="settings-list">';
  data.fields.forEach(function(f,i){
    var p=progress(f);var lap=lapCount(f);
    html+='<div class="sc"><div class="sc-head"><input class="sc-name-input" type="text" value="'+f.name+'" onchange="updF('+i+',\'name\',this.value)" placeholder="分野名"><button class="sc-del" onclick="removeField('+i+')">削除</button></div>'
      +'<div class="sc-fields"><div class="sc-field"><span class="sc-fl">全体問題数</span><input class="sc-input" type="number" min="0" value="'+f.total+'" onchange="updF('+i+',\'total\',this.value)"></div>'
      +'<div class="sc-field"><span class="sc-fl">1日目標</span><input class="sc-input" type="number" min="0" value="'+f.dailyGoal+'" onchange="updF('+i+',\'dailyGoal\',this.value)"></div>'
      +'<div class="sc-field"><span class="sc-fl">既存の解答数</span><input class="sc-input" type="number" min="0" value="'+(f.prevSolved||0)+'" onchange="updF('+i+',\'prevSolved\',this.value)"></div></div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px"><div class="sc-field"><span class="sc-fl">進捗率（自動）</span><div class="sc-mastery">'+p+'%</div></div><div class="sc-field"><span class="sc-fl">周回数（自動）</span><div class="sc-mastery">'+lap+'周目</div></div></div>'
      +'<textarea class="sc-textarea" placeholder="メモ..." onchange="updF('+i+',\'memo\',this.value)">'+(f.memo||'')+'</textarea></div>';
  });
  html+='</div><div class="add-field-card"><input type="text" id="new-name" placeholder="新しい分野名..."><button class="btn-add" onclick="addField()">追加</button></div>';
  html+='<div class="sec-label">データ管理</div><div class="data-card"><button class="btn-io" onclick="exportData()">書き出す（JSON）</button><label class="btn-io" style="cursor:pointer">読み込む（JSON）<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label></div>';
  html+='<div class="hint-card"><b>iPhoneでホーム画面に追加する方法</b><br>Safari でこのページを開く → 下部の共有ボタン（□↑）→「ホーム画面に追加」→「追加」</div>';
  html+='</div>';
  document.getElementById('tab-settings').innerHTML=html;
}

function doLogout(){
  if(confirm('ログアウトしますか？')){
    logoutFromServer();
    sb.auth.signOut();
  }
}
function updF(i,key,val){if(key==='total'||key==='dailyGoal'||key==='prevSolved')val=parseInt(val)||0;data.fields[i][key]=val;save();if(key==='name')renderCounter();}
function removeField(i){if(!confirm('「'+data.fields[i].name+'」を削除しますか？'))return;data.fields.splice(i,1);delete openCards[i];save();renderSettings();}
function addField(){var inp=document.getElementById('new-name');var name=inp.value.trim();if(!name)return;data.fields.push({name:name,total:100,dailyGoal:10,prevSolved:0,memo:'',counts:{},logs:[]});inp.value='';save();renderSettings();}
function exportData(){var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='study_tracker_data.json';a.click();}
function importData(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{data=JSON.parse(ev.target.result);save();renderSettings();alert('読み込みました！');}catch(err){alert('ファイルが読み込めませんでした');}};reader.readAsText(file);}

initAuth();
