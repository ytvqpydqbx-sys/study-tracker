<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Tracker">
<meta name="theme-color" content="#FAF7F3">
<title>Study Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#faf7f3;--surface:#ffffff;--border:#e8e1da;--border2:#ddd6ce;
  --text:#4a3e36;--text2:#7b6a60;--text3:#a69a90;
  --accent:#c07a5a;--accent-light:#f5ede9;--accent-mid:#d4957a;
  --nav-h:72px;--radius:10px;--radius-sm:7px;--radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}

/* ── ログイン画面 ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px}
.login-logo{margin-bottom:18px}
.login-title{font-size:24px;font-weight:700;color:var(--text);letter-spacing:.01em;margin-bottom:8px;text-align:center}
.login-sub{font-size:14px;color:var(--text3);text-align:center;line-height:1.6;margin-bottom:48px}
.login-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:28px 24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--surface);font-size:14px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit}
.login-divider{display:flex;align-items:center;gap:10px;color:var(--text3);font-size:12px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:0.5px;background:var(--border)}
.skip-btn{padding:11px;border:none;background:transparent;font-size:13px;color:var(--text3);cursor:pointer;font-family:inherit;text-align:center}
.login-note{font-size:11px;color:var(--text3);text-align:center;line-height:1.6}

/* ── メインアプリ ── */
#main-screen{display:none}
.app{max-width:480px;margin:0 auto;padding:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px);min-height:100vh}
.header{padding:calc(env(safe-area-inset-top,0px) + 14px) 22px 2px;margin-bottom:8px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left h1{font-size:14px;font-weight:600;letter-spacing:.01em;color:var(--text)}
.header-left p{font-size:11px;color:var(--text3);margin-top:1px}
.header-streak{display:flex;align-items:center;gap:3px;background:var(--accent-light);border:0.5px solid var(--accent-mid);border-radius:99px;padding:4px 10px;flex-shrink:0}
.header-streak-num{font-size:15px;font-weight:700;color:var(--accent);line-height:1}
.header-streak-label{font-size:12px;color:var(--accent);white-space:nowrap;line-height:1}
.sync-badge{font-size:10px;color:var(--text3);padding:0 16px;margin-bottom:4px;min-height:0}

/* ── ボトムナビ ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:0.5px solid var(--border);display:flex;align-items:flex-start;z-index:100}
.nav-btn{flex:1;height:var(--nav-h);border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text3);font-family:inherit;position:relative;transition:color .2s;padding:10px 0;}
.nav-btn.active{color:var(--accent)}
.nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.nav-btn.active .nav-icon{transform:scale(1.12)}
.nav-label{font-size:10px;letter-spacing:.02em;color:var(--text3);transition:color .2s,max-height .2s,opacity .2s;color:var(--accent)}
.nav-btn.active .nav-label{color:var(--accent)}
.nav-btn:not(.active) .nav-label{opacity:0;max-height:0;overflow:hidden;height:0;margin:0;pointer-events:none}
.nav-btn::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .2s}
.nav-btn:not(.active){gap:0}
.nav-btn.active::after{opacity:1}

/* ── 共通カード ── */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;margin-bottom:16px}
.mc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 12px 10px}
.mc-label{font-size:10px;color:var(--text3);margin-bottom:5px;letter-spacing:.02em}
.mc-value{font-size:19px;font-weight:600;color:var(--text);line-height:1}
.mc-sub{font-size:10px;color:var(--text3);margin-top:3px}
.today-big{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:18px 16px;margin:0 16px 16px;text-align:center}
.today-big-num{font-size:64px;font-weight:700;color:var(--accent);line-height:1}
.today-big-label{font-size:12px;color:var(--text3);margin-top:6px}
.goal-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px}
.goal-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.goal-label{font-size:13px;color:var(--text);font-weight:500;flex:1}
.goal-input{padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);-webkit-appearance:none;font-family:inherit}
.goal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gs-item{text-align:center}
.gs-val{font-size:16px;font-weight:600;color:var(--text)}
.gs-label{font-size:10px;color:var(--text3);margin-top:2px}
.sec-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text3);padding:0 16px;margin-bottom:8px}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:16px}
.fc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 14px 12px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.fc:active{border-color:var(--accent-mid)}
.fc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fc-name{font-size:13px;font-weight:600;color:var(--text)}
.fc-arrow{font-size:11px;color:var(--text3);transition:transform .2s}
.fc-arrow.open{transform:rotate(180deg)}
.fc-lap{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:3px}
.fc-goal-line{font-size:11px;color:var(--text3);margin-bottom:8px}
.counter-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.cnt-btn{width:36px;height:36px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cnt-btn:active{background:var(--accent-light);transform:scale(.93)}
.cnt-num{font-size:24px;font-weight:700;color:var(--text);flex:1;text-align:center;line-height:1}
.fc-bar-bg{height:5px;background:var(--accent-light);border-radius:99px;overflow:hidden}
.fc-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.fc-detail{margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);display:none;flex-direction:column;gap:8px}
.fc-detail.open{display:flex}
.fc-detail-row{display:flex;justify-content:space-between;align-items:center}
.fc-detail-label{font-size:11px;color:var(--text3)}
.fc-detail-val{font-size:12px;font-weight:600;color:var(--text)}
.fc-memo{font-size:11px;color:var(--text2);font-style:italic}
.fc-log-title{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--text3);margin-top:2px}
.fc-log-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.fc-log-item{display:flex;align-items:center;gap:6px;font-size:11px}
.fc-log-time{color:var(--text3);white-space:nowrap;flex-shrink:0}
.fc-log-badge{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.fc-log-badge.plus{background:var(--accent-light);color:var(--accent)}
.fc-log-badge.minus{background:#f1ede8;color:var(--text3)}
.fc-log-text{color:var(--text2)}

/* ── ヒートマップ ── */
.hm-outer{padding:0 16px;margin-bottom:16px}
.hm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hm-month-title{font-size:14px;font-weight:600;color:var(--text)}
.hm-streak-badge{display:flex;align-items:center;gap:5px;background:var(--accent-light);border:0.5px solid var(--accent-mid);border-radius:99px;padding:4px 10px}
.hm-streak-num{font-size:13px;font-weight:700;color:var(--accent)}
.hm-streak-label{font-size:11px;color:var(--accent)}
.hm-field-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.hm-field-scroll::-webkit-scrollbar{display:none}
.hm-fb{padding:5px 13px;border-radius:99px;border:0.5px solid var(--border);background:transparent;font-size:12px;font-weight:400;cursor:pointer;color:var(--text3);white-space:nowrap;font-family:inherit}
.hm-fb.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.hm-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.hm-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.hm-dow{font-size:9px;color:var(--text3);text-align:center}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm-cell{aspect-ratio:1;border-radius:5px;cursor:pointer;transition:transform .12s}
.hm-cell:active{transform:scale(.88)}
.hm-cell.today-cell{outline:2px solid var(--accent);outline-offset:1px}
.hm-legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:10px;color:var(--text3)}
.hm-lc{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.hm-summary{margin-top:12px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.hm-sum-val{font-size:19px;font-weight:600;color:var(--text)}
.hm-sum-label{font-size:10px;color:var(--text3);margin-top:2px}

/* ── 日付モーダル ── */
.day-modal-bg{position:fixed;inset:0;background:rgba(74,62,54,0.3);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:bgFadeIn .2s ease}
@keyframes bgFadeIn{from{opacity:0}to{opacity:1}}
.day-modal{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;animation:slideUp .22s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.day-modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 16px}
/* スワイプ削除 */
.swipe-wrap{position:relative;overflow:hidden;border-radius:14px;margin-bottom:8px}
.swipe-del-bg{position:absolute;inset:0;background:#c0584a;display:flex;align-items:center;justify-content:flex-end;padding-right:24px;border-radius:14px}
.swipe-del-bg span{color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.swipe-fg{position:relative;will-change:transform}
/* アコーディオン展開アニメ */
.acc-body{animation:accExpand .25s ease}
@keyframes accExpand{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
/* 分野展開（grid-rowsで高さを滑らかに・Apple風） */
.field-acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s cubic-bezier(.4,0,.2,1)}
.field-acc.open{grid-template-rows:1fr}
.field-acc>.field-acc-inner{overflow:hidden;min-height:0}
.field-chips{opacity:0;transform:translateY(6px);transition:opacity .2s ease,transform .2s ease}
.field-acc.open .field-chips{opacity:1;transform:translateY(0);transition-delay:.1s}
.field-chev{transition:transform .24s cubic-bezier(.4,0,.2,1)}
.field-chev.open{transform:rotate(90deg)}
.day-modal-date{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px}
.day-modal-total{font-size:13px;color:var(--text2);margin-bottom:16px}
.day-modal-breakdown{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.day-modal-row{display:flex;align-items:center;justify-content:space-between}
.day-modal-field{font-size:13px;color:var(--text2)}
.day-modal-count{font-size:13px;font-weight:600;color:var(--text)}
.day-modal-bar-bg{height:4px;background:var(--accent-light);border-radius:99px;overflow:hidden;flex:1;margin:0 10px}
.day-modal-bar-fill{height:100%;border-radius:99px;background:var(--accent)}
.day-modal-close{width:100%;padding:12px;border:none;background:var(--bg);border-radius:var(--radius-sm);font-size:14px;color:var(--text2);cursor:pointer;font-family:inherit}

/* ── 実績 ── */
.ach-header{padding:0 16px;margin-bottom:12px}
.ach-summary{display:flex;align-items:center;gap:8px;margin-top:4px}
.ach-summary-text{font-size:13px;color:var(--text2)}
.ach-summary-bar-bg{flex:1;height:6px;background:var(--accent-light);border-radius:99px;overflow:hidden}
.ach-summary-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.ach-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:0 16px;margin-bottom:16px}
.ach-card{background:var(--surface);border:0.5px solid var(--border);border-radius:13px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:transform .12s}
.ach-card:active{transform:scale(.96)}
.ach-card.unlocked{background:var(--accent-light);border-color:var(--accent-mid)}
.ach-card.locked{opacity:.5}
.ach-badge-circle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ach-badge-circle.unlocked{background:var(--accent);box-shadow:0 2px 6px rgba(192,122,90,0.25)}
.ach-badge-circle.locked{background:var(--bg);border:0.5px solid var(--border2)}
.ach-name{font-size:11px;font-weight:600;color:var(--text);line-height:1.15}

/* バッジコレクション（4列グリッド）*/
.ach-coll-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin-bottom:22px}
.ach-coll{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .12s}
.ach-coll:active{transform:scale(.92)}
.ach-coll-badge{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ach-coll-badge.unlocked{background:var(--accent);box-shadow:0 2px 7px rgba(192,122,90,0.28)}
.ach-coll-badge.locked{background:var(--bg);border:0.5px solid var(--border)}
.ach-check{position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.ach-coll-name{font-size:9px;color:var(--text2);text-align:center;line-height:1.2}
.ach-coll-name.locked{color:var(--text3)}
.ach-desc{font-size:9px;color:var(--text3);line-height:1.3}

/* 実績通知 */
.ach-toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);background:var(--surface);border:0.5px solid var(--accent-mid);border-radius:var(--radius-lg);padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);z-index:300;box-shadow:0 4px 16px rgba(74,62,54,.12);white-space:nowrap;animation:toastIn .3s cubic-bezier(.34,1.2,.64,1)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.92)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes setFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.set-fade{animation:setFadeIn .18s ease-out both}
.set-cell{transition:transform .12s ease,background .12s ease}
.set-cell:active{transform:scale(.98);background:rgba(74,62,54,0.03)}
.main-cnt-btn{transition:transform .1s ease,box-shadow .1s ease}
.main-cnt-btn:active{transform:scale(.98)}
@keyframes numOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-22%)}}
@keyframes numIn{from{opacity:0;transform:translateY(28%)}to{opacity:1;transform:translateY(0)}}
.num-out{animation:numOut .16s cubic-bezier(.4,0,.6,1) forwards}
.num-in{animation:numIn .19s cubic-bezier(.16,.84,.44,1) forwards}
.field-row{transition:transform .12s ease,background .12s ease}
.field-row:active{transform:scale(.98);background:rgba(74,62,54,0.03)}
.field-bar-fill{transition:width .2s cubic-bezier(.16,.84,.44,1),background .2s ease}

/* ── 設定 ── */
.settings-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.sc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.sc-head{display:flex;align-items:center;margin-bottom:10px;gap:8px}
.sc-name-input{flex:1;padding:5px 8px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-weight:600;background:var(--bg);color:var(--text);font-family:inherit}
.sc-del{font-size:12px;color:var(--accent);border:0.5px solid #e8c4b0;border-radius:6px;padding:3px 8px;background:transparent;cursor:pointer;font-family:inherit;white-space:nowrap}
.sc-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.sc-field{display:flex;flex-direction:column;gap:4px}
.sc-fl{font-size:10px;color:var(--text3)}
.sc-input{padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);width:100%;font-family:inherit}
.sc-mastery{font-size:13px;font-weight:600;color:var(--accent);padding:6px 8px;background:var(--accent-light);border-radius:var(--radius-sm);text-align:center}
.sc-textarea{width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:12px;resize:none;min-height:52px;background:var(--bg);color:var(--text);font-family:inherit}
.add-field-card{background:var(--accent-light);border:0.5px dashed var(--accent-mid);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px;display:flex;gap:8px;align-items:center}
.add-field-card input{flex:1;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);font-family:inherit}
.btn-add{padding:8px 16px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.logout-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px;display:flex;align-items:center;justify-content:space-between}
.logout-user{font-size:13px;color:var(--text2)}
.logout-btn{padding:7px 14px;border-radius:var(--radius-sm);border:0.5px solid #e8c4b0;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;font-family:inherit}
.data-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 10px;display:flex;gap:8px;flex-wrap:wrap}
.btn-io{flex:1;padding:9px 12px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);font-size:12px;cursor:pointer;text-align:center;min-width:100px;font-family:inherit}
.hint-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin:0 16px 16px;font-size:12px;color:var(--text2);line-height:1.7}
.hint-card b{color:var(--text);font-weight:600}
.tab-pane{animation:tabFade .18s ease}
/* 起動スプラッシュ（段階制御：テキスト→背景の順に消す） */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:1;transition:opacity .6s ease}
#splash.bg-out{opacity:0}
#splash-text{font-size:46px;font-weight:300;letter-spacing:.02em;color:var(--text);opacity:1;transition:opacity 1.4s ease}
#splash.text-out #splash-text{opacity:0}
@keyframes tabFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ＋−ボタンの押下アニメーション */
.cnt-btn{transition:transform .1s ease, background .15s ease}
.cnt-btn.pop{animation:btnPop .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes btnPop{0%{transform:scale(1)}40%{transform:scale(.82)}100%{transform:scale(1)}}
.cnt-btn.pop-minus{animation:btnPopMinus .2s ease}
@keyframes btnPopMinus{0%{transform:scale(1)}50%{transform:scale(.9)}100%{transform:scale(1)}}
/* 数字の拡大アニメーション */
.cnt-num{transition:transform .12s ease}
.cnt-num.bump{animation:numBump .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes numBump{0%{transform:scale(1)}40%{transform:scale(1.28);color:var(--accent)}100%{transform:scale(1)}}
.cnt-num.bump-minus{animation:numBumpMinus .22s ease}
@keyframes numBumpMinus{0%{transform:scale(1)}50%{transform:scale(.88)}100%{transform:scale(1)}}
/* プログレスバーを滑らかに */
.fc-bar-fill{transition:width .45s cubic-bezier(.4,0,.2,1)}
/* 連続記録カードの更新演出 */
@keyframes streakGlow{0%{transform:scale(1)}30%{transform:scale(1.06)}100%{transform:scale(1)}}
.streak-card.celebrate{animation:streakGlow .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes flamePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.12)}}

/* メイン分野カウンター */
.main-cnt-btn{transition:transform .1s ease, background .15s ease}
.main-cnt-btn.pop{animation:btnPop .25s cubic-bezier(.34,1.56,.64,1)}
.main-cnt-btn.pop-minus{animation:btnPopMinus .2s ease}
.main-cnt-num{transition:transform .12s ease}
.main-cnt-num.bump{animation:numBump .3s cubic-bezier(.34,1.56,.64,1)}
.main-cnt-num.bump-minus{animation:numBumpMinus .22s ease}
.main-bar-fill{transition:width .45s cubic-bezier(.4,0,.2,1)}
/* 最近の記録 */
.recent-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12px}
.recent-row+.recent-row{border-top:0.5px solid var(--border)}
.recent-time{color:var(--text3);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.recent-field{color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-delta{font-weight:600;white-space:nowrap}
.recent-delta.plus{color:var(--accent)}
.recent-delta.minus{color:var(--text3)}
</style>

async function saveSessionToServer(session){
  try{
    await fetch('/api/auth?action=set-session',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        access_token:session.access_token,
        refresh_token:session.refresh_token,
        expires_at:session.expires_at,
      }),
      credentials:'include',
    });
  }catch(e){console.error('session save error',e);}
}

// サーバーのHttpOnly Cookieからユーザー情報を取得
async function getUserFromServer(){
  try{
    var res=await fetch('/api/auth?action=session',{credentials:'include'});

    var json=await res.json();
    return json.user||null;
  }catch(e){return null;}
}

// ── STEP0-a：分野に問題集(workbooks)階層を後付けするマイグレーション ──
// 冪等：既にworkbooksがあれば何もしない。既存の分野は「問題集1冊」として包む。
// 既存の集計プロパティ(total/dailyGoal/prevSolved/counts/logs)は分野側に残したまま、
// workbooks[0]へコピーして移行する（後方互換のため分野側も当面保持）。
function migrateToWorkbooks(d){
  if(!d||!d.fields)return d;
  d.fields.forEach(function(f){
    if(!Array.isArray(f.workbooks)||f.workbooks.length===0){
      f.workbooks=[{
        name:f.name,
        total:f.total||0,
        dailyGoal:f.dailyGoal||0,
        prevSolved:f.prevSolved||0,
        counts:f.counts||{},
        logs:f.logs||[]
      }];
    }
  });
  return d;
}

// ── 複数試験(exams)へのマイグレーション ──
// 冪等：既にexamsがあれば何もしない。既存のfields/examName/goalDateを試験1つに包む。
function migrateToExams(d){
  if(!d)return d;
  if(Array.isArray(d.exams)&&d.exams.length>0){
    // activeExamIdが無効なら先頭に
    if(!d.activeExamId||!d.exams.some(function(e){return e.id===d.activeExamId;})){
      d.activeExamId=d.exams[0].id;
    }
    return d;
  }
  // 既存データを試験1つに包む
  var ex={
    id:'exam_'+Date.now(),
    name:(d.examName&&d.examName.trim())?d.examName:'',
    goalDate:d.goalDate||'',
    fields:d.fields||[]
  };
  d.exams=[ex];
  d.activeExamId=ex.id;
  return d;
}

// アクティブ試験オブジェクトを取得
function activeExam(){
  if(!data.exams||!data.exams.length)return null;
  var e=data.exams.filter(function(x){return x.id===data.activeExamId;})[0];
  return e||data.exams[0];
}

}

var GOAL_MILESTONES=[
  {key:'round1',label:'1周目完了'},
  {key:'round2',label:'2周目完了'},
  {key:'exam',label:'試験当日'}
];
function sectionGoals(){
  var e=activeExam();
  if(!e)return{};
  if(!e.sectionGoals)e.sectionGoals={};
  migrateSectionGoals(e.sectionGoals);
  return e.sectionGoals;
}
// 旧形式 {短答:'2026-07-31'} → 新形式 {短答:{round1:'',round2:'',exam:'2026-07-31'}} へ冪等移行
// 旧値は「試験当日」の目標日として引き継ぐ（従来の意味に最も近いため）
function migrateSectionGoals(sg){
  WB_SECTIONS.forEach(function(s){
    var v=sg[s];
    if(typeof v==='string'){sg[s]={round1:'',round2:'',exam:v||''};}
    else if(!v){sg[s]={round1:'',round2:'',exam:''};}
    else{GOAL_MILESTONES.forEach(function(m){if(v[m.key]===undefined)v[m.key]='';});}
  });
}
// 問題集の有効な目標日（個別設定＞区分テンプレート）。milestoneKey省略時は現在の周回段階に応じて自動選択
function wbMilestoneKey(w){
  var lap=wbLap(w);
  if(lap<=1)return 'round1';
  if(lap===2)return 'round2';
  return 'exam';
}
function effectiveWbGoal(w,milestoneKey){
  if(w.goalDate)return w.goalDate; // 個別設定が最優先
  if(!w.section)return null;
  var key=milestoneKey||wbMilestoneKey(w);
  var sg=sectionGoals()[w.section];
  return (sg&&sg[key])?sg[key]:null;
}
// テンプレート保存（applyExisting=trueで個別未設定の同区分問題集へ反映）
function saveSectionGoal(section,milestoneKey,date,applyExisting){
  var sg=sectionGoals();
  if(!sg[section])sg[section]={round1:'',round2:'',exam:''};
  sg[section][milestoneKey]=date||'';
  if(applyExisting){
    data.fields.forEach(function(f){
      fieldWorkbooks(f).forEach(function(w){
        if(w.section===section&&!w.goalCustom&&wbMilestoneKey(w)===milestoneKey){w.goalDate='';/*個別未設定のまま＝テンプレ追従*/}
      });
    });
  }
  save();
}
// 目標日が設定された日付→問題集リストのマップ（実績カレンダー連携用）
function goalDateMap(){
  var m={};
  data.fields.forEach(function(f){
    fieldWorkbooks(f).forEach(function(w){
      var g=effectiveWbGoal(w);
      if(g){if(!m[g])m[g]=[];m[g].push({name:w.name,section:w.section||''});}
    });
  });
  return m;
}

// ── ID付与（将来の並び替え・アーカイブ・同期の基盤）──
// 冪等：既にidがあれば何もしない。
// 新しい永続エンティティを追加したら ID_TARGETS に1行足すだけでID付与が効く。
function genId(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function eachWorkbook(d,fn){
  (d.exams||[]).forEach(function(e){
    (e.fields||[]).forEach(function(f){
      (Array.isArray(f.workbooks)?f.workbooks:[]).forEach(function(w){fn(w,f,e);});
    });
  });
}
var ID_TARGETS=[
  {prefix:'exam',get:function(d){return d.exams||[];}},
  {prefix:'f',get:function(d){var a=[];(d.exams||[]).forEach(function(e){(e.fields||[]).forEach(function(f){a.push(f);});});return a;}},
  {prefix:'w',get:function(d){var a=[];eachWorkbook(d,function(w){a.push(w);});return a;}},
  {prefix:'log',get:function(d){var a=[];eachWorkbook(d,function(w){(w.logs||[]).forEach(function(l){a.push(l);});});return a;}},
  {prefix:'ms',get:function(d){return d.milestones||[];}}, // マイルストーン（実装前だが先行対応）
  // 将来: Counter を1対多化する場合はここに {prefix:'cnt',get:...} を追加
];
function ensureIds(d){
  ID_TARGETS.forEach(function(t){
    t.get(d).forEach(function(o){if(o&&typeof o==='object'&&!o.id)o.id=genId(t.prefix);});
  });
}

async function loadFromCloud(){if(!currentUser)return false;try{var res=await sb.from('study_data').select('data').eq('user_id',currentUser.id).single();if(res.data&&res.data.data){data=res.data.data;data.fields=data.fields||[];data.fields.forEach(function(f){if(f.prevSolved===undefined)f.prevSolved=0;if(!f.logs)f.logs=[];});

async function initAuth(){
  // 1. まずSupabase標準のlocalStorageからセッション復元を試みる
  var sessionRes=await sb.auth.getSession();
  var session=sessionRes.data&&sessionRes.data.session?sessionRes.data.session:null;

  if(session){
    // localStorageにセッションあり → サーバーのCookieにも保存
    currentUser=session.user;
    await saveSessionToServer(session);
    await migrateLocalToCloud();
    var loaded=await loadFromCloud();
    if(loaded)showSync('☁ クラウドから読み込みました');
    showMainScreen();
    return;
  }

  // 2. localStorageになければサーバーのHttpOnly Cookieを確認（PWA対応）
  var serverUser=await getUserFromServer();
  if(serverUser){
    currentUser=serverUser;
    await migrateLocalToCloud();
    var loaded2=await loadFromCloud();
    if(loaded2)showSync('☁ クラウドから読み込みました');
    showMainScreen();
    return;
  }

  // 3. どちらもなければログイン画面
  showLoginScreen();

  // 認証状態の変化を監視
  sb.auth.onAuthStateChange(async function(event,session){
    if(event==='SIGNED_IN'&&session){
      currentUser=session.user;
      // HttpOnly CookieにセッションをセットしてPWAでも維持
      await saveSessionToServer(session);
      await migrateLocalToCloud();
      var loaded=await loadFromCloud();
      if(loaded)showSync('☁ クラウドから読み込みました');
      showMainScreen();
    }else if(event==='SIGNED_OUT'){
      currentUser=null;
      await logoutFromServer();
      data=loadLocal();
      showLoginScreen();
    }else if(event==='TOKEN_REFRESHED'&&session){
      currentUser=session.user;
      await saveSessionToServer(session);
    }
  });
}

  var wait=Math.max(0,1500-elapsed); // 最低1.5秒は静止表示
  setTimeout(function(){
    var _sp=document.getElementById('splash');if(!_sp)return;
    // 1. タイトルをフェードアウト（背景は不透明のまま＝下の画面は見えない）
    _sp.classList.add('text-out');
    // 2. テキストのフェード完了後に背景をフェード（ここで初めて下の画面が現れる）
    setTimeout(function(){
      _sp.classList.add('bg-out');
      // 3. 背景フェード完了後に除去
      setTimeout(function(){if(_sp)_sp.style.display='none';},650);
    },1450);
  },wait);
}

// 「学習日」の境界は深夜5時。0〜4時台の操作は前日に加算する。
// ローカル時刻基準でYYYY-MM-DDを返す（UTCずれを排除）。
var DAY_BOUNDARY_HOUR=5;
function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function studyDate(d){
  var x=new Date(d.getTime());
  if(x.getHours()<DAY_BOUNDARY_HOUR)x.setDate(x.getDate()-1);
  return x;
}
function todayStr(){return localDateStr(studyDate(new Date()));}
// フォールバック：万一auth判定が遅くても最大3.5秒で消す
setTimeout(function(){if(!_authReady)dismissSplash();},3500);

// ── STEP0-b：分野の集計は配下の全問題集(workbooks)を合算する ──
// workbooksが無い場合は従来どおりfield自身を1冊として扱う（後方互換）。
function fieldWorkbooks(f){
  if(Array.isArray(f.workbooks)&&f.workbooks.length>0)return f.workbooks;
  return [f]; // フォールバック：分野自身を1冊扱い
}
function wbCounted(w){var s=0;Object.keys(w.counts||{}).forEach(function(k){s+=w.counts[k];});return s;}
function wbSolved(w){return (w.prevSolved||0)+wbCounted(w);}
function wbProgress(w){return w.total>0?Math.min(100,Math.round(wbSolved(w)/w.total*100)):0;}
// 周回：currentRound / roundStartSolved を明示保持（設計書5準拠）。
// 未確定の間は目標到達しても次周へ進めず、confirmWbRoundComplete()の「完了する」で進む。
function wbLap(w){
  if(typeof w.currentRound==='number')return w.currentRound;
  return w.total>0?Math.floor(wbSolved(w)/w.total)+1:1; // 未マイグレーションの旧データ用フォールバック
}
// この周でこれまでに解いた数（roundStartSolvedからの差分）
function wbInRound(w){return Math.max(0,wbSolved(w)-(w.roundStartSolved||0));}
// 目標到達済みだが未確認か
function wbRoundPending(w){return !!(w.total>0&&wbInRound(w)>=w.total&&!w._roundJustReset);}
// 旧データ（currentRound未保持）を、現行のlap計算と矛盾しない形で補完する
function migrateWbRounds(d){
  eachWorkbook(d,function(w){
    if(typeof w.currentRound!=='number'){
      var lap=w.total>0?Math.floor(wbSolved(w)/w.total)+1:1;
      w.currentRound=lap;
      w.roundStartSolved=w.total>0?(lap-1)*w.total:0;
    }
  });
}
function wbTodayCount(w){return(w.counts||{})[todayStr()]||0;}

// 分野(field)単位：配下の問題集を合算
function fieldTotalQ(f){return fieldWorkbooks(f).reduce(function(a,w){return a+(w.total||0);},0);}
function totalCounted(f){return fieldWorkbooks(f).reduce(function(a,w){return a+wbCounted(w);},0);}
function totalSolved(f){return fieldWorkbooks(f).reduce(function(a,w){return a+wbSolved(w);},0);}
function progress(f){var t=fieldTotalQ(f);return t>0?Math.min(100,Math.round(totalSolved(f)/t*100)):0;}
function lapCount(f){var t=fieldTotalQ(f);return t>0?Math.floor(totalSolved(f)/t)+1:1;}
function todayCount(f){return fieldWorkbooks(f).reduce(function(a,w){return a+wbTodayCount(w);},0);}
function fieldDailyGoal(f){return fieldWorkbooks(f).reduce(function(a,w){return a+(w.dailyGoal||0);},0);}
// 分野の日別カウント合算（ヒートマップ・streak用）
function fieldCountForDate(f,key){return fieldWorkbooks(f).reduce(function(a,w){return a+((w.counts||{})[key]||0);},0);}

// メインに表示する分野：最後に触った分野を最優先（自動おすすめはしない）
// アクティブな問題集を持つ分野が対象。1つも無ければ-1
function getMainFieldIdx(){
  if(!data.fields.length)return -1;
  if(data.lastActiveWb&&data.fields[data.lastActiveWb.f]&&activeWbCount(data.fields[data.lastActiveWb.f])>0)return data.lastActiveWb.f;
  if(typeof data.lastActiveField==='number'&&data.fields[data.lastActiveField]&&activeWbCount(data.fields[data.lastActiveField])>0)return data.lastActiveField;
  for(var i=0;i<data.fields.length;i++){if(activeWbCount(data.fields[i])>0)return i;}
  return -1;
}

// 分野内でメインに表示する問題集：最後に触った問題集を最優先
// アクティブ（非アーカイブ）が1冊も無ければ-1
function getMainWbIdx(fieldIdx){
  var f=data.fields[fieldIdx];if(!f)return -1;
  var wbs=fieldWorkbooks(f);
  if(data.lastActiveWb&&data.lastActiveWb.f===fieldIdx&&typeof data.lastActiveWb.w==='number'&&wbs[data.lastActiveWb.w]&&!wbs[data.lastActiveWb.w].archivedAt)return data.lastActiveWb.w;
  // 先頭のアクティブ（非アーカイブ）問題集
  for(var j=0;j<wbs.length;j++){if(!wbs[j].archivedAt)return j;}
  return -1;
}

// ── アーカイブ ──
// 問題集は削除ではなくアーカイブが基本：ホーム非表示・記録保持・実績集計には含む・復元可能
function isActiveWb(w){return !w.archivedAt;}
function activeWbCount(f){return fieldWorkbooks(f).filter(isActiveWb).length;}
function archiveWb(fi,wj){
  var wbs=fieldWorkbooks(data.fields[fi]);var w=wbs[wj];if(!w)return;
  w.archivedAt=new Date().toISOString();
  // メイン表示中だったら選択をリセット
  if(data.lastActiveWb&&data.lastActiveWb.f===fi&&data.lastActiveWb.w===wj)data.lastActiveWb=null;
  save();
}
function restoreWb(fi,wj){
  var wbs=fieldWorkbooks(data.fields[fi]);var w=wbs[wj];if(!w)return;
  delete w.archivedAt;
  save();
}

// 全分野の全問題集をフラットに列挙（前/次ナビ用）
function getAllWorkbooks(){
  var list=[];
  data.fields.forEach(function(f,fi){
    fieldWorkbooks(f).forEach(function(w,wi){
      list.push({fieldIdx:fi,wbIdx:wi,field:f,wb:w});
    });
  });
  return list;
}
// 現在アクティブな問題集がフラットリストの何番目か
function getActiveFlatPos(list){
  var fi=getMainFieldIdx();
  var wi=getMainWbIdx(fi);
  for(var k=0;k<list.length;k++){if(list[k].fieldIdx===fi&&list[k].wbIdx===wi)return k;}
  return 0;
}

// 全分野・全問題集の操作ログを時系列で取得（直近n件）
function getRecentLogs(n){
  var all=[];
  data.fields.forEach(function(f){
    fieldWorkbooks(f).forEach(function(w){
      (w.logs||[]).forEach(function(log){
        all.push({ts:log.ts,delta:log.delta,name:f.name});
      });
    });
  });
  all.sort(function(a,b){return b.ts-a.ts;});
  return all.slice(0,n);
}

// 日ごとの解答数合計（直近n日、記録のある日のみ）を新しい順で返す
function getRecentDays(n){
  var dayTotals={};
  data.fields.forEach(function(f){
    fieldWorkbooks(f).forEach(function(w){
      Object.keys(w.counts||{}).forEach(function(k){
        var v=w.counts[k]||0;
        if(v>0)dayTotals[k]=(dayTotals[k]||0)+v;
      });
    });
  });
  var keys=Object.keys(dayTotals).sort(function(a,b){return a<b?1:-1;});
  return keys.slice(0,n).map(function(k){return {date:k,total:dayTotals[k]};});
}

// 連続記録：全試験を通じて、1日1問でも解いた日が続いているか
function calcStreak(){
  var allDates={};
  var exams=(data.exams&&data.exams.length)?data.exams:[{fields:data.fields}];
  exams.forEach(function(ex){
    (ex.fields||[]).forEach(function(f){
      fieldWorkbooks(f).forEach(function(w){
        Object.keys(w.counts||{}).forEach(function(k){if(w.counts[k]>0)allDates[k]=true;});
      });
    });
  });
  var streak=0;var d=studyDate(new Date());if(!allDates[localDateStr(d)])d.setDate(d.getDate()-1);
  while(true){var key=localDateStr(d);if(!allDates[key])break;streak++;d.setDate(d.getDate()-1);}
  return streak;
}
function updateHeaderStreak(){var el=document.getElementById('streak-num');if(el)el.textContent=calcStreak();}

function calcStats(){
  var totalS=data.fields.reduce(function(a,f){return a+totalSolved(f);},0);
  var streak=calcStreak();
  // 周回は問題集単位で判定（いずれかの問題集の最大周回）
  var maxLap=1;
  data.fields.forEach(function(f){fieldWorkbooks(f).forEach(function(w){var l=wbLap(w);if(l>maxLap)maxLap=l;});});
  var minProg=data.fields.length?data.fields.reduce(function(a,f){return Math.min(a,progress(f));},100):0;
  var now2=studyDate(new Date());var yr=now2.getFullYear(),mo=now2.getMonth();
  var daysInMonth=new Date(yr,mo+1,0).getDate();
  var thisMonthDays=0;
  var allDates={};
  data.fields.forEach(function(f){
    fieldWorkbooks(f).forEach(function(w){
      Object.keys(w.counts||{}).forEach(function(k){if(w.counts[k]>0)allDates[k]=true;});
    });
  });
  for(var d=1;d<=daysInMonth;d++){var key=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(allDates[key])thisMonthDays++;}
  // perfectDays: 連続で全分野が1日目標を達成した日数（分野=配下問題集合算）
  var perfectDays=0;var pd=studyDate(new Date());
  for(var i=0;i<365;i++){
    var pkey=localDateStr(pd);
    var allMet=data.fields.every(function(f){return fieldCountForDate(f,pkey)>=fieldDailyGoal(f);});
    if(allMet&&data.fields.length>0){perfectDays++;pd.setDate(pd.getDate()-1);}else break;
  }
  // 日別合計マップ（全分野横断）
  var dayMap={};
  data.fields.forEach(function(f){fieldWorkbooks(f).forEach(function(w){Object.keys(w.counts||{}).forEach(function(k){dayMap[k]=(dayMap[k]||0)+(w.counts[k]||0);});});});
  // 1日の最大問題数
  var maxDay=0;Object.keys(dayMap).forEach(function(k){if(dayMap[k]>maxDay)maxDay=dayMap[k];});
  // 全分野の最小周回（＝全分野が達成した最低周回数）
  var allFieldsLap=data.fields.length?data.fields.reduce(function(a,f){var fl=1;fieldWorkbooks(f).forEach(function(w){var l=wbLap(w);if(l<fl||fl===1)fl=Math.min(fl===1?l:fl,l);});return Math.min(a,fl);},999):0;
  if(allFieldsLap===999)allFieldsLap=0;
  // 解除済み実績数
  var unlockedNum=(data.unlockedAchievements||[]).length;
  // 月間皆勤（今月の全日に記録）／年間皆勤（過去365日すべて記録）
  var monthPerfect=(thisMonthDays>=daysInMonth&&daysInMonth>0);
  return{totalSolved:totalS,streak:streak,maxLap:maxLap,minProgress:minProg,thisMonthDays:thisMonthDays,perfectDays:perfectDays,maxDay:maxDay,allFieldsLap:allFieldsLap,unlockedNum:unlockedNum,monthPerfect:monthPerfect,dayMap:dayMap};
}

function checkAchievements(){
  var stats=calcStats();
  var newlyUnlocked=[];
  if(!data.achUnlockDates)data.achUnlockDates={};
  ACHIEVEMENTS.forEach(function(ach){
    if(data.unlockedAchievements.indexOf(ach.id)===-1&&ach.check(data,stats)){
      data.unlockedAchievements.push(ach.id);
      data.achUnlockDates[ach.id]=todayStr();
      newlyUnlocked.push(ach);
    }
  });
  if(newlyUnlocked.length>0){
    saveLocal(data);
    newlyUnlocked.forEach(function(ach,i){
      setTimeout(function(){showAchToast(ach);},i*1800);
    });
  }
}

function triggerHaptic(strong){

// 前/次の問題集へ（全分野横断、ループ）
function navWorkbook(dir){
  var list=getAllWorkbooks();
  if(list.length<=1)return;
  var pos=getActiveFlatPos(list);
  var next=(pos+dir+list.length)%list.length;
  var t=list[next];
  data.lastActiveField=t.fieldIdx;
  data.lastActiveWb={f:t.fieldIdx,w:t.wbIdx};
  save();
  renderCounter();
}

// 分野チップの展開：排他選択（他を閉じて1つだけ開く）
function toggleFieldExpand(i){
  var isOpen=!!expandedFields[i];
  if(isOpen){
    // 閉じる：逆順（チップ→高さ→chevron）アニメ後にrender
    var acc=document.getElementById('field-acc-'+i);
    var chev=document.querySelector('.field-chev[data-fi="'+i+'"]');
    if(acc)acc.classList.remove('open');
    if(chev)chev.classList.remove('open');
    expandedFields={};
    setTimeout(function(){renderCounter();},250);
  }else{
    // 開く：状態更新→render→（描画後rAFでopen付与しアニメ発火）
    expandedFields={};expandedFields[i]=true;_animateField=i;
    renderCounter();
  }
}

      +'<div style="font-size:11px;color:var(--text3);margin-top:3px;">'+wlap+'周目 ・ '+wInLap+' / '+wtot+'問</div>'
      +'</div>'
      +'<div style="flex-shrink:0;margin-left:12px;text-align:right;">'

// 分野iのメイン問題集に記録（分野一覧・タップ用）
function increment(i,delta){
  var j=getMainWbIdx(i);
  incrementWb(i,j,delta);
}

// 分野i・問題集jに記録
function incrementWb(i,j,delta){
  var t=todayStr();
  var f=data.fields[i];
  if(!f)return;
  var wbs=fieldWorkbooks(f);
  var w=wbs[j]||wbs[0];
  if(!w)return;
  if(!w.counts)w.counts={};
  // 0から減算しようとした場合は何もしない
  if(delta<0&&(w.counts[t]||0)===0)return;
  w.counts[t]=Math.max(0,(w.counts[t]||0)+delta);
  if(!w.logs)w.logs=[];
  w.logs.push({ts:Date.now(),delta:delta,total:wbCounted(w)});
  if(w.logs.length>30)w.logs=w.logs.slice(-30);

  // この操作の前に表示されていたメインを判定
  var mainIdx=getMainFieldIdx();
  var mainWb=getMainWbIdx(mainIdx);
  var isMain=(i===mainIdx&&j===mainWb);

  // 最後に操作した分野・問題集を記録
  data.lastActiveField=i;
  data.lastActiveWb={f:i,w:j};

  triggerHaptic(false);

  // 表示更新：今日・累計・リング（周回内進捗はroundStartSolved基準）
  var wbSol=wbSolved(w);
  var wbTod=wbTodayCount(w);
  var wbTot=w.total||0;
  var wbInLap=wbInRound(w);
  var wbLapPct=wbTot>0?Math.min(100,Math.round(wbInLap/wbTot*100)):0;

  if(isMain){
    var mBtn=document.getElementById(delta>0?'main-plus':'main-minus');
    var mToday=document.getElementById('main-today');
    var mNum=document.getElementById('main-num');
    var mInlap=document.getElementById('main-inlap');
    if(mToday){
      var oldVal=mToday.textContent;
      if(oldVal!==String(wbTod)){
        var wrap=mToday.parentNode;// inline-flex（数字＋問）
        wrap.style.position='relative';
        var ghost=document.createElement('span');
        ghost.textContent=oldVal;
        ghost.style.cssText='position:absolute;left:0;top:0;width:'+mToday.offsetWidth+'px;font-size:78px;font-weight:700;color:var(--text);line-height:.9;letter-spacing:-.03em;pointer-events:none;';
        ghost.className='num-out';
        wrap.insertBefore(ghost,wrap.firstChild);
        mToday.textContent=wbTod;
        mToday.classList.remove('num-in');void mToday.offsetWidth;mToday.classList.add('num-in');
        setTimeout(function(){if(ghost.parentNode)ghost.parentNode.removeChild(ghost);},220);
      }else{mToday.textContent=wbTod;}
    }
    if(mNum)mNum.textContent=wbSol;
    if(mInlap)mInlap.textContent=wbInLap;
    // リング更新
    var ring=document.querySelector('#active-card svg circle:last-child');
    if(ring){var r2=15,circ2=Math.round(2*Math.PI*r2);ring.setAttribute('stroke-dasharray',Math.round(circ2*(wbLapPct/100))+' '+circ2);}
    var ringText=document.getElementById('main-ring-pct');
    if(ringText)ringText.textContent=wbLapPct+'%';
  }

  // 分野行の進捗%・バー更新
  var fpNew=progress(f);
  var fpctEl=document.getElementById('fpct-'+i);
  var fbarEl=document.getElementById('fbar-'+i);
  if(fpctEl)fpctEl.innerHTML=fpNew+'<span style="font-size:10px;color:var(--text3);font-weight:400;">%</span>';
  if(fbarEl){
    var wasFull=(fbarEl.style.width==='100%');
    fbarEl.style.width=fpNew+'%';
    if(fpNew>=100){fbarEl.style.background='var(--accent)';if(!wasFull)triggerHaptic(true);}
    else fbarEl.style.background='var(--accent-mid)';
  }

  save();
  updateHeaderStreak();

  // メイン以外を操作した場合はメインカードを追従
  if(!isMain){
    clearTimeout(window._mainSwitchTimer);
    window._mainSwitchTimer=setTimeout(function(){renderCounter();},400);
  }

  // 目標到達：確認シートを表示（＋で到達した時のみ・多重表示防止）
  if(delta>0&&wbTot>0&&wbInRound(w)>=wbTot&&!window._roundSheetOpen){
    window._roundSheetOpen=true;
    setTimeout(function(){showRoundCompleteSheet(i,j);},350);
  }
}

// 周回完了：次周へ進める（currentRound+1・開始点更新・次マイルストーンの目標日を自動参照）
// 手動で次周へ進める（設定画面から・未到達でも可）
function manualAdvanceRound(fi,wj){
  var f=data.fields[fi];if(!f)return;
  var wbs=fieldWorkbooks(f);var w=wbs[wj];if(!w)return;
  w.currentRound=(w.currentRound||wbLap(w))+1;
  w.roundStartSolved=wbSolved(w);
  save();
  renderSettings();
}
function confirmRoundComplete(fi,wj){
  var f=data.fields[fi];if(!f)return;
  var wbs=fieldWorkbooks(f);var w=wbs[wj];if(!w)return;
  w.currentRound=(w.currentRound||wbLap(w))+1;
  w.roundStartSolved=wbSolved(w);
  triggerHaptic(true);
  save();
  dismissRoundSheet();
  renderCounter();
}

function updateStreakCard(streak){
  var el=document.getElementById('streak-card-num');
  if(el)el.textContent=streak;
}

// ── ヒートマップ ──
function hmColorForCount(cnt){
  if(cnt===0)return HM_COLORS[0];
  if(cnt<=9)return HM_COLORS[1];
  if(cnt<=29)return HM_COLORS[2];
  if(cnt<=49)return HM_COLORS[3];
  return HM_COLORS[4];
}

function shortFieldName(name){
  var map={'行政法規':'法規','鑑定理論':'理論','法規・法令':'法規','財務・会計':'財務','マーケティング':'マーケ'};
  if(map[name])return map[name];
  return name.length>4?name.slice(0,4):name;
}

function renderHeatmap(){
  var now2=new Date();var yr=now2.getFullYear(),mo=now2.getMonth();
  var todayKey=todayStr();var daysInMonth=new Date(yr,mo+1,0).getDate();var firstDow=new Date(yr,mo,1).getDay();
  var streak=calcStreak();

  function getDayCounts(fieldIdx){
    var counts={};
    var targets=fieldIdx===-1?data.fields:(data.fields[fieldIdx]?[data.fields[fieldIdx]]:[]);
    targets.forEach(function(f){
      fieldWorkbooks(f).forEach(function(w){
        Object.keys(w.counts||{}).forEach(function(k){counts[k]=(counts[k]||0)+(w.counts[k]||0);});
      });
    });
    return counts;
  }
  var counts=getDayCounts(hmFieldIdx);

  // 全分野での記録有無（連続判定用）
  var anyCounts={};
  data.fields.forEach(function(f){fieldWorkbooks(f).forEach(function(w){Object.keys(w.counts||{}).forEach(function(k){if(w.counts[k]>0)anyCounts[k]=true;});});});

  var html='<div class="tab-pane"><div style="padding:0 16px;">';

  // ── ヘッダー：月のみ ──
  html+='<div style="font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.01em;margin:4px 0 14px;">'+yr+'年'+(mo+1)+'月</div>';

  // ── 分野タブ（短縮表示）──
  html+='<div class="hm-field-scroll">';
  html+='<button class="hm-fb'+(hmFieldIdx===-1?' active':'')+'" onclick="hmFieldIdx=-1;renderHeatmap()">全体</button>';
  data.fields.forEach(function(fd,i){html+='<button class="hm-fb'+(i===hmFieldIdx?' active':'')+'" onclick="hmFieldIdx='+i+';renderHeatmap()">'+shortFieldName(fd.name)+'</button>';});
  html+='</div>';

  // ── ヒートマップ（主役・マス拡大・連続帯演出）──
  html+='<div style="background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:18px 16px 14px;">';
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:7px;">'+DOWS.map(function(d){return '<div style="font-size:10px;color:var(--text3);text-align:center;">'+d+'</div>';}).join('')+'</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';
  for(var e=0;e<firstDow;e++)html+='<div></div>';
  for(var d=1;d<=daysInMonth;d++){
    var key=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cnt=counts[key]||0;
    var dateObj=new Date(key+' 00:00:00');
    var isFuture=dateObj>now2;
    var isToday=key===todayKey;
    var hasRecord=anyCounts[key];
    var dow=dateObj.getDay();
    var col=isFuture?HM_COLORS[0]:hmColorForCount(cnt);
    var op=isFuture?'0.3':'1';

    function recAt(off){
      var dd=new Date(dateObj);dd.setDate(dd.getDate()+off);
      var kk=dd.toISOString().slice(0,10);
      return anyCounts[kk];
    }
    var br='8px';
    var radius='border-radius:'+br+';';
    if(hasRecord){
      var connectLeft=(dow!==0)&&recAt(-1);
      var connectRight=(dow!==6)&&recAt(1);
      var tl=connectLeft?'2px':br, bl=connectLeft?'2px':br;
      var tr=connectRight?'2px':br, brd=connectRight?'2px':br;
      radius='border-radius:'+tl+' '+tr+' '+brd+' '+bl+';';
    }
    // 今日：テラコッタ枠＋薄い背景。記録ありなら濃淡優先しつつ枠を付ける
    var extra='';
    if(isToday){
      if(cnt===0)col='#faeee8';// ごく薄いテラコッタ背景
      extra='box-shadow:inset 0 0 0 2px var(--accent);';
    }
    html+='<div onclick="openDayModal(\''+key+'\')" style="aspect-ratio:1;background:'+col+';opacity:'+op+';cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;'+radius+extra+'"><span style="font-size:10px;color:'+(cnt>50?'#fff':(isToday?'var(--accent)':'var(--text3)'))+';font-weight:'+(isToday?'700':'400')+';">'+d+'</span></div>';
  }
  html+='</div>';
  html+='<div style="display:flex;align-items:center;gap:3px;margin-top:14px;font-size:9px;color:var(--text3);opacity:.7;justify-content:flex-end;"><span>少</span>';
  HM_COLORS.forEach(function(c){html+='<div style="width:10px;height:10px;border-radius:2px;background:'+c+';"></div>';});
  html+='<span>多</span></div>';
  html+='</div>';

  // ── 最近の記録（日ごとの解答数で振り返り）──
  var showAll=!!hmShowAllLogs;
  var days=getRecentDays(showAll?60:5);
  html+='<div class="sec-label" style="margin-top:18px;padding:0;">最近の記録</div>';
  if(days.length>0){
    var tdStr=todayStr();
    var ydObj=new Date();ydObj.setDate(ydObj.getDate()-1);var ydStr=ydObj.toISOString().slice(0,10);
    html+='<div style="margin:0 0 8px;background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:4px 16px;">';
    days.forEach(function(dd){
      var label;
      if(dd.date===tdStr)label='今日';
      else if(dd.date===ydStr)label='昨日';
      else{var p=dd.date.split('-');label=parseInt(p[1])+'/'+parseInt(p[2]);}
      html+='<div class="recent-row" onclick="openDayModal(\''+dd.date+'\')" style="cursor:pointer;">'
        +'<span class="recent-field" style="flex:1;">'+label+'</span>'
        +'<span style="font-weight:600;color:var(--text2);white-space:nowrap;">'+dd.total+'<span style="font-size:10px;color:var(--text3);font-weight:400;margin-left:1px;">問</span></span>'
        +'</div>';
    });
    html+='</div>';
    if(getRecentDays(60).length>5){
      html+='<div style="text-align:center;margin:0 0 16px;"><button onclick="hmShowAllLogs=!hmShowAllLogs;renderHeatmap()" style="font-size:12px;color:var(--accent);background:transparent;border:none;cursor:pointer;font-family:inherit;padding:6px 12px;">'+(showAll?'閉じる':'すべて見る')+'</button></div>';
    }else{
      html+='<div style="height:16px;"></div>';
    }
  }else{
    html+='<div style="padding:6px 2px 18px;font-size:12px;color:var(--text3);">まだ記録がありません</div>';
  }

  html+='</div></div>';
  document.getElementById('tab-heatmap').innerHTML=html;
}

function openDayModal(dateKey){
  var parts=dateKey.split('-');
  var yr=parseInt(parts[0]),mo=parseInt(parts[1]),dy=parseInt(parts[2]);
  var dObj=new Date(dateKey);
  var dateLabel=yr+'.'+mo+'.'+dy+' ('+DOWS_EN[dObj.getDay()]+')';
  var totalCnt=0;
  var breakdown=data.fields.map(function(f){var c=fieldCountForDate(f,dateKey);totalCnt+=c;return{name:f.name,count:c};});
  var maxCount=Math.max.apply(null,breakdown.map(function(b){return b.count;}));
  var html='<div class="day-modal-bg" onclick="closeDayModal()">'
    +'<div class="day-modal" onclick="event.stopPropagation()">'
    +'<div class="day-modal-handle"></div>'
    +'<div class="day-modal-date">'+dateLabel+'</div>'
    +'<div class="day-modal-total">合計 '+totalCnt+'問</div>'
    +'<div class="day-modal-breakdown">';
  breakdown.forEach(function(b){
    var pct=maxCount>0?Math.round(b.count/maxCount*100):0;
    html+='<div class="day-modal-row"><span class="day-modal-field">'+b.name+'</span>'
      +'<div class="day-modal-bar-bg"><div class="day-modal-bar-fill" style="width:'+pct+'%"></div></div>'
      +'<span class="day-modal-count">'+b.count+'問</span></div>';
  });
  html+='</div><button class="day-modal-close" onclick="closeDayModal()">閉じる</button></div></div>';
  var el=document.getElementById('day-modal');
  el.innerHTML=html;el.style.display='block';
}
function closeDayModal(){var el=document.getElementById('day-modal');el.style.display='none';el.innerHTML='';}

// ── 実績 ──
function renderAchievements(){
  var stats=calcStats();
  var unlocked=data.unlockedAchievements||[];
  var solvedQ=data.fields.reduce(function(a,f){return a+totalSolved(f);},0);
  var streak=calcStreak();
  var sd=studyDate(new Date());
  var now2=new Date(sd.getFullYear(),sd.getMonth(),sd.getDate(),23,59,59);
  var goals=goalDateMap();
  var msMap=milestoneDateMap();
  if(achViewYear===null){achViewYear=sd.getFullYear();achViewMonth=sd.getMonth();}
  if(achSelectedDay===null)achSelectedDay=todayStr();
  var yr=achViewYear,mo=achViewMonth;
  var daysInMonth=new Date(yr,mo+1,0).getDate();
  var firstDow=new Date(yr,mo,1).getDay();
  var todayKey=todayStr();

  // 日別合計（全分野）
  var counts={};
  data.fields.forEach(function(f){fieldWorkbooks(f).forEach(function(w){Object.keys(w.counts||{}).forEach(function(k){counts[k]=(counts[k]||0)+(w.counts[k]||0);});});});

  var html='<div class="tab-pane"><div style="padding:0 16px;">';

  // ════ 1. ヒートマップ ════
  html+='<div style="background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:13px 16px 5px;margin:4px 0 12px;">';
  // 1行：月切替（左）＋連続記録（右）
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">'
    +'<div style="display:flex;align-items:center;gap:6px;">'
    +'<button onclick="achPrevMonth()" style="width:26px;height:26px;border:none;background:transparent;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>'
    +'<span style="font-size:15px;font-weight:600;color:var(--text);min-width:88px;text-align:center;">'+yr+'年'+(mo+1)+'月</span>'
    +'<button onclick="achNextMonth()" style="width:26px;height:26px;border:none;background:transparent;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>'
    +'</div>'
    +'<span style="display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--accent);">'
    +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3 4 4.5 4 8a4 4 0 0 1-8 0c0-1.5.5-2.5 1-3.5C9.5 8 10 9 11 9c0-2 0-4.5 1-7z"/></svg>'
    +streak+'日</span>'
    +'</div>';
  // 曜日見出し
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:2px;">'+DOWS.map(function(d){return '<div style="font-size:10px;color:var(--text3);text-align:center;">'+d+'</div>';}).join('')+'</div>';
  // マス（HM_DOT=true:ドット版／false:四角セル版）
  var HM_DOT=true;
  // ドットのサイズ＆色（5段階・差を明確に）
  function achDotSpec(c){
    if(c===0)return{sz:6,col:'#ddd4cb'};      // 未学習
    if(c<=9)return{sz:9,col:HM_COLORS[1]};    // 少量
    if(c<=29)return{sz:12,col:HM_COLORS[2]};  // 中量
    if(c<=59)return{sz:15,col:HM_COLORS[3]};  // 多量
    return{sz:18,col:HM_COLORS[4]};           // 大量
  }
  var LINK_LINE='rgba(178,74,46,0.35)';// 連続日をつなぐ細いライン
  function dayCnt(dd){
    if(dd<1||dd>daysInMonth)return 0;
    var k=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    return counts[k]||0;
  }
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';
  for(var e=0;e<firstDow;e++)html+='<div></div>';
  for(var d=1;d<=daysInMonth;d++){
    var key=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cnt=counts[key]||0;
    var dObj=new Date(key+' 00:00:00');
    var isFuture=dObj>now2;
    var isToday=key===todayKey;
    var isSel=key===achSelectedDay;
    var dow=(firstDow+d-1)%7;
    var op=isFuture?'0.3':'1';
    if(HM_DOT){
      var spec=achDotSpec(cnt);
      // 連続学習：右隣（同じ週内）も学習日なら細いラインで接続
      var hasNext=cnt>0&&dow<6&&dayCnt(d+1)>0;
      var link=hasNext?'<span style="position:absolute;top:50%;left:50%;width:calc(100% + 4px);height:1.5px;background:'+LINK_LINE+';transform:translateY(-50%);"></span>':'';
      // 選択リング：ドット外側に余白＋2pxリング
      var dotExtra=isSel?'box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);':'';
      var isGoal=!!goals[key];
      var hasMs=!!msMap[key];
      html+='<div onclick="achSelectDay(\''+key+'\')" style="aspect-ratio:1;opacity:'+op+';cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">'
        +'<span style="font-size:9px;line-height:1;color:'+(isSel||isToday||isGoal?'var(--accent)':'var(--text3)')+';font-weight:'+(isSel||isToday||isGoal?'700':'400')+';'+(isGoal?'border-bottom:1.5px solid var(--accent-mid);padding-bottom:1px;':'')+'">'+d+'</span>'
        +'<span style="position:relative;width:100%;height:18px;display:flex;align-items:center;justify-content:center;">'
        +link
        +'<span style="position:relative;width:'+spec.sz+'px;height:'+spec.sz+'px;border-radius:50%;background:'+spec.col+';'+dotExtra+'flex-shrink:0;"></span>'
        +'</span>'
        +(hasMs?'<span style="width:3px;height:3px;border-radius:50%;background:var(--accent);flex-shrink:0;"></span>':'<span style="height:3px;"></span>')
        +'</div>';
    }else{
      var col=isFuture?HM_COLORS[0]:hmColorForCount(cnt);
      var extra='';
      if(isSel)extra='box-shadow:inset 0 0 0 2px var(--accent);';
      else if(isToday)extra='box-shadow:inset 0 0 0 1.5px var(--accent-mid);';
      html+='<div onclick="achSelectDay(\''+key+'\')" style="aspect-ratio:1;background:'+col+';opacity:'+op+';cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:5px;'+extra+'"><span style="font-size:10px;color:'+(cnt>50?'#fff':(isSel||isToday?'var(--accent)':'var(--text3)'))+';font-weight:'+(isSel||isToday?'700':'400')+';">'+d+'</span></div>';
    }
  }
  html+='</div>';
  html+='</div>';

  // ════ 2. 選択日の詳細（日付＋総数＋分野別テキスト）════
  var selTotal=0;
  var breakdown=data.fields.map(function(f){var c=fieldCountForDate(f,achSelectedDay);selTotal+=c;return{name:f.name,count:c};}).filter(function(b){return b.count>0;});
  breakdown.sort(function(a,b){return b.count-a.count;});
  var selParts=achSelectedDay.split('-');
  var selDateObj=new Date(parseInt(selParts[0]),parseInt(selParts[1])-1,parseInt(selParts[2]));
  var selLabel=parseInt(selParts[0])+'年'+parseInt(selParts[1])+'月'+parseInt(selParts[2])+'日（'+DOWS[selDateObj.getDay()]+'）';
  html+='<div style="margin:0 0 10px;padding:0 2px;">';
  html+='<div style="font-size:12px;color:var(--text3);line-height:1;">'+selLabel+'</div>';
  // この日が目標日の問題集
  if(goals[achSelectedDay]){
    var gl=goals[achSelectedDay].map(function(g){return (g.section?g.section+'：':'')+g.name;}).join(' ・ ');
    html+='<div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--accent);margin-top:5px;">'
      +'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>'
      +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">目標日：'+gl+'</span></div>';
  }
  // この日のマイルストーン
  var dayMs=milestoneDateMap()[achSelectedDay]||[];
  if(dayMs.length){
    dayMs.forEach(function(ms){
      var mt=MILESTONE_TYPES[ms.type]||MILESTONE_TYPES.free;
      html+='<div onclick="openMilestoneSheet(\''+ms.id+'\')" style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);margin-top:4px;cursor:pointer;">'
        +'<span style="color:var(--accent);display:flex;flex-shrink:0;">'+mt.icon+'</span>'
        +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(ms.title||mt.label)+'</span></div>';
    });
  }
  html+='<div onclick="openMilestoneSheet(null)" style="display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text3);margin-top:5px;cursor:pointer;">'
    +'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>予定を追加</div>';
  html+='<div style="font-size:32px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-.02em;margin-top:4px;">'+selTotal+'<span style="font-size:15px;color:var(--text3);font-weight:400;margin-left:2px;">問</span></div>';
  if(breakdown.length){
    html+='<div style="margin-top:7px;">';
    breakdown.forEach(function(b){
      html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0;">'
        +'<span style="font-size:13px;color:var(--text2);">'+b.name+'</span>'
        +'<span style="font-size:13px;font-weight:600;color:var(--text);">'+b.count+'<span style="font-size:10px;color:var(--text3);font-weight:400;margin-left:1px;">問</span></span>'
        +'</div>';
    });
    html+='</div>';
  }else{
    html+='<div style="font-size:12px;color:var(--text3);margin-top:6px;">この日の記録はありません</div>';
  }
  html+='</div>';

  // ════ 3. 統計（横並びテキスト・カードなし）════
  var monthTotal=0;
  var mPrefix=yr+'-'+String(mo+1).padStart(2,'0');
  Object.keys(counts).forEach(function(k){if(k.indexOf(mPrefix)===0)monthTotal+=counts[k];});
  html+='<div style="font-size:13px;color:var(--text2);margin:0 0 16px;padding:0 2px;">'
    +'今月 <span style="font-weight:600;color:var(--text);">'+monthTotal.toLocaleString()+'</span>'
    +'<span style="color:var(--border2);margin:0 8px;">｜</span>'
    +'累計 <span style="font-weight:600;color:var(--accent);">'+solvedQ.toLocaleString()+'</span>'
    +'</div>';

  // ════ 4. 達成（2列グリッド）════
  // 達成間近リスト（優先：残り1〜3日 → 残り問数が少ない → その他）
  var nearList=[];
  ACHIEVEMENTS.forEach(function(a){
    if(unlocked.indexOf(a.id)!==-1)return;
    if(!a.remain)return;
    var r=a.remain(stats);
    if(r>0)nearList.push({ach:a,remain:r,pri:(a.unit==='日'&&r<=3)?0:(a.unit==='問'?1:2)});
  });
  nearList.sort(function(a,b){return a.pri-b.pri||a.remain-b.remain;});
  var nearTop=nearList.slice(0,5);
  var nearIds=nearTop.map(function(x){return x.ach.id;});
  var achUnlockedCount=ACHIEVEMENTS.filter(function(a){return unlocked.indexOf(a.id)!==-1;}).length;

  // 表示候補：達成済み3個＋達成間近3個＝固定6個（シークレット未達成は除外）
  var doneList=ACHIEVEMENTS.filter(function(a){return unlocked.indexOf(a.id)!==-1;});
  var shown=[];
  doneList.slice(0,3).forEach(function(a){shown.push({a:a,done:true});});

var ACH_CATS=[

function achProgressValue(a,stats){
  // 0〜1の進捗（remainベース）
  if(!a.remain)return 0;
  var r=a.remain(stats);
  var cur,target;
  if(a.unit==='日'){cur=stats.streak;}
  else if(a.unit==='問'){cur=(a.cat==='daily')?stats.maxDay:stats.totalSolved;}
  else if(a.unit==='周'){cur=(a.cat==='field')?stats.allFieldsLap:stats.maxLap;}
  else if(a.unit==='個'){cur=stats.unlockedNum;}
  else{cur=Math.max(0,(r<=0?1:0));}
  target=cur+Math.max(0,r);
  if(target<=0)return 0;
  return Math.max(0,Math.min(1,cur/target));
}
function achCurTarget(a,stats){
  if(!a.remain)return null;
  var r=a.remain(stats);var cur;
  if(a.unit==='日')cur=stats.streak;
  else if(a.unit==='問')cur=(a.cat==='daily')?stats.maxDay:stats.totalSolved;
  else if(a.unit==='周')cur=(a.cat==='field')?stats.allFieldsLap:stats.maxLap;
  else if(a.unit==='個')cur=stats.unlockedNum;
  else cur=0;
  return{cur:cur,target:cur+Math.max(0,r),unit:a.unit,remain:r};
}
function progBar(ratio){
  return '<div style="height:4px;border-radius:2px;background:rgba(74,62,54,0.08);overflow:hidden;"><div style="height:100%;width:'+Math.round(ratio*100)+'%;background:var(--accent-mid);border-radius:2px;"></div></div>';

  html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--border);"><span style="font-size:14px;color:var(--text);">1日の目標</span><input class="sc-input" style="width:90px;text-align:right;" type="number" min="0" value="'+(w.dailyGoal||0)+'" onchange="updWB('+setSelField+','+setSelWb+',\'dailyGoal\',this.value)"></div>';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;"><span style="font-size:14px;color:var(--text);">既存の解答数</span><input class="sc-input" style="width:90px;text-align:right;" type="number" min="0" value="'+(w.prevSolved||0)+'" onchange="updWB('+setSelField+','+setSelWb+',\'prevSolved\',this.value)"></div>';
  html+='</div>';
  // 現況
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:11px 14px;background:var(--accent-light);border-radius:10px;font-size:12px;color:var(--text2);">'
    +'<span>現在の累計 <b style="color:var(--accent);font-size:15px;">'+wbSolved(w)+'</b> / '+(w.total||0)+'問</span>'

  // 他分野へ移動
  if(data.fields.length>1&&wbs.length>1){
    var opts='<option value="">他の分野へ移動…</option>';
    data.fields.forEach(function(of,oi){if(oi!==setSelField)opts+='<option value="'+oi+'">'+of.name+'へ移動</option>';});
    html+='<select onchange="moveWbFromDetail(this.value)" style="margin-top:12px;width:100%;font-size:14px;color:var(--text2);border:0.5px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 14px;font-family:inherit;">'+opts+'</select>';

  html+='<div onclick="archiveWbFromDetail()" style="display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text2);font-size:14px;cursor:pointer;padding:18px 0 4px;">'

// 画面遷移ヘルパー
function openSettingsField(i){setSelField=i;settingsView='field';setWbFormOpen=false;setEditingName=false;renderSettings();}
function openSettingsWb(j){setSelWb=j;settingsView='wb';setWbBack='field';setEditingName=false;renderSettings();}
function openSettingsWbFromList(fi,j){setSelField=fi;setSelWb=j;settingsView='wb';setWbBack='wbList';setEditingName=false;renderSettings();}
function openSettingsExam(id){setSelExamId=id;settingsView='exam';setEditingName=false;renderSettings();}
function startEditName(){
  setEditingName=true;renderSettings();
  setTimeout(function(){var i=document.getElementById('edit-name-input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},50);
}
function settingsBack(){
  setEditingName=false;
  if(settingsView==='wb'){settingsView=(setWbBack==='wbList')?'wbList':'field';}
  else if(settingsView==='field'){settingsView='fieldList';}
  else if(settingsView==='exam'){settingsView='list';}
  else{settingsView='list';setExamFormOpen=false;setFieldFormOpen=false;setWbFormOpen=false;}
  renderSettings();
}
function addWbFromList(){

  var v=inp?inp.value.trim():'';if(!v)return;

// 試験詳細画面

    html+='<div style="display:flex;align-items:center;gap:8px;padding:0 0 16px;">'

      +'<span onclick="startEditName()" style="cursor:pointer;padding:4px;display:flex;flex-shrink:0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span>'
      +'</div>';
  }

  html+='<div class="settings-list" style="background:var(--surface);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;">';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--border);"><span style="font-size:14px;color:var(--text);">目標日（試験当日）</span><input class="sc-input" style="text-align:right;" type="date" value="'+(ex.goalDate||'')+'" onchange="updExam(\''+ex.id+'\',\'goalDate\',this.value);syncExamDayMilestone(this.value)"></div>';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--border);"><span style="font-size:14px;color:var(--text);">申込開始日</span><input class="sc-input" style="text-align:right;" type="date" value="'+(ex.applicationOpenDate||'')+'" onchange="updExam(\''+ex.id+'\',\'applicationOpenDate\',this.value);syncAppMilestone(\'app_open\',this.value)"></div>';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--border);"><span style="font-size:14px;color:var(--text);">申込締切日</span><input class="sc-input" style="text-align:right;" type="date" value="'+(ex.applicationCloseDate||'')+'" onchange="updExam(\''+ex.id+'\',\'applicationCloseDate\',this.value);syncAppMilestone(\'app_close\',this.value)"></div>';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;"><span style="font-size:14px;color:var(--text);">分野数</span><span style="font-size:14px;color:var(--text3);">'+(ex.fields||[]).length+'</span></div>';
  html+='</div>';
  // 区分ごとの目標日テンプレート（この試験の問題集に適用）
  if(on){
    var sg=sectionGoals();
    html+='<div class="sec-label" style="margin-top:22px;">区分の目標日</div>';
    WB_SECTIONS.forEach(function(s,si){
      html+='<div style="font-size:13px;font-weight:600;color:var(--text2);margin:'+(si>0?'16px':'4px')+' 0 6px;">'+s+'</div>';
      html+='<div class="settings-list" style="background:var(--surface);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:4px;">';
      GOAL_MILESTONES.forEach(function(m,mi){
        html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;'+(mi<GOAL_MILESTONES.length-1?'border-bottom:0.5px solid var(--border);':'')+'">'
          +'<span style="font-size:13px;color:var(--text2);">'+m.label+'</span>'
          +'<input class="sc-input" style="width:150px;text-align:right;border:none;background:transparent;font-family:inherit;font-size:14px;color:var(--text);" type="date" value="'+((sg[s]&&sg[s][m.key])||'')+'" onchange="onSectionGoalChange(\''+s+'\',\''+m.key+'\',this.value)">'
          +'</div>';
      });
      html+='</div>';
    });
    html+='<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);padding:10px 4px 0;cursor:pointer;">'
      +'<input type="checkbox" id="sg-apply-existing" checked style="accent-color:var(--accent);width:15px;height:15px;">'

  }
  // 切り替え
  if(on){
    html+='<div style="text-align:center;font-size:12px;color:var(--accent);font-weight:600;margin-top:14px;">✓ この試験を選択中</div>';
  }else{
    html+='<button class="btn-add" style="width:100%;margin-top:14px;padding:11px;" onclick="switchExamFromSettings(\''+ex.id+'\')">この試験に切り替え</button>';
  }
  // 削除（最後の1つは不可・ゴミ箱）
  if(data.exams.length>1){
    html+='<div onclick="removeExamFromDetail()" style="display:flex;align-items:center;justify-content:center;gap:6px;color:#c0584a;font-size:14px;cursor:pointer;padding:22px 0 4px;">'
      +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c0584a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>'
      +'この試験を削除</div>';
  }
  html+='</div></div>';
  document.getElementById('tab-settings').innerHTML=html;
}
// 区分テンプレート変更（チェックONなら既存問題集にも適用）
function onSectionGoalChange(section,milestoneKey,date){
  var chk=document.getElementById('sg-apply-existing');
  var applyExisting=chk?chk.checked:true;
  saveSectionGoal(section,milestoneKey,date,applyExisting);
  renderSettings();
}
function removeExamFromDetail(){
  if(data.exams.length<=1){alert('試験は最低1つ必要です');return;}
  var ex=data.exams.filter(function(x){return x.id===setSelExamId;})[0];
  if(!ex)return;
  if(!confirm('「'+(ex.name||'無題の試験')+'」を削除しますか？配下の分野・問題集・記録もすべて消えます'))return;
  data.exams=data.exams.filter(function(x){return x.id!==setSelExamId;});
  if(data.activeExamId===setSelExamId)data.activeExamId=data.exams[0].id;
  syncActiveExam();
  expandedFields={};data.lastActiveField=undefined;data.lastActiveWb=null;
  settingsView='examList';save();renderSettings();
}
function addWbFromField(){
  var inp=document.getElementById('new-wb-name');var v=inp?inp.value.trim():'';if(!v)return;
  var f=data.fields[setSelField];if(!Array.isArray(f.workbooks))f.workbooks=fieldWorkbooks(f);
  f.workbooks.push({name:v,total:100,dailyGoal:5,prevSolved:0,counts:{},logs:[]});
  setWbFormOpen=false;save();renderSettings();
}
function removeFieldFromDetail(){
  var f=data.fields[setSelField];if(!f)return;
  if(!confirm('「'+f.name+'」を削除しますか？配下の問題集・記録もすべて消えます'))return;
  data.fields.splice(setSelField,1);data.lastActiveField=undefined;data.lastActiveWb=null;
  settingsView='fieldList';save();renderSettings();
}
function removeWbFromDetail(){
  var f=data.fields[setSelField];var wbs=fieldWorkbooks(f);
  if(wbs.length<=1)return;
  if(!confirm('「'+wbs[setSelWb].name+'」を削除しますか？記録も消えます'))return;
  f.workbooks.splice(setSelWb,1);
  settingsView=(setWbBack==='wbList')?'wbList':'field';save();renderSettings();
}
// 問題集詳細からアーカイブ
function archiveWbFromDetail(){
  var f=data.fields[setSelField];var wbs=fieldWorkbooks(f);var w=wbs[setSelWb];if(!w)return;
  if(!confirm('「'+w.name+'」をアーカイブしますか？\nホームから非表示になりますが、記録はすべて残り、いつでも復元できます'))return;
  archiveWb(setSelField,setSelWb);
  settingsView=(setWbBack==='wbList')?'wbList':'field';renderSettings();
}
// アーカイブ一覧から復元
function restoreWbFromList(fi,wj){
  restoreWb(fi,wj);
  renderSettings();
}
// アーカイブ一覧から完全削除（記録も消える）
function deleteWbPermanent(fi,wj){
  var f=data.fields[fi];var wbs=fieldWorkbooks(f);var w=wbs[wj];if(!w)return;
  if(!confirm('「'+w.name+'」を完全に削除しますか？\n記録もすべて消え、元に戻せません'))return;
  f.workbooks.splice(wj,1);
  save();renderSettings();
}
function moveWbFromDetail(targetIdx){
  if(targetIdx==='')return;
  moveWB(setSelField,setSelWb,targetIdx);
  settingsView=(setWbBack==='wbList')?'wbList':'field';renderSettings();
}


function doLogout(){
  if(confirm('ログアウトしますか？')){
    logoutFromServer();
    sb.auth.signOut();
  }
}
function updF(i,key,val){
  data.fields[i][key]=val;
  // 分野名は代表問題集名にも同期（問題集が1冊だけの場合は名前を揃える）
  if(key==='name'){
    var wbs=fieldWorkbooks(data.fields[i]);
    if(wbs.length===1)wbs[0].name=val;
  }
  save();
  if(key==='name')renderCounter();
}
// 問題集の値を更新
function updWB(i,j,key,val){
  if(key==='total'||key==='dailyGoal'||key==='prevSolved')val=parseInt(val)||0;
  var wbs=fieldWorkbooks(data.fields[i]);
  if(!wbs[j])return;
  wbs[j][key]=val;
  // 区分を変更した場合、個別設定でなければ何もしない
  // → effectiveWbGoal()が新しい区分のテンプレートを動的に引くため、値コピーは不要
  if(key==='section'&&!wbs[j].goalCustom){wbs[j].goalDate='';}
  // 目標日を直接変更したら個別設定としてテンプレートより優先
  if(key==='goalDate'){
    wbs[j].goalCustom=!!val;
    if(!val)wbs[j].goalDate=''; // 空にしたらテンプレートに戻る（自動追従）
  }
  // 分野に古いフラットなworkbooksが無い場合の保険
  if(!Array.isArray(data.fields[i].workbooks))data.fields[i].workbooks=wbs;
  save();
}
// 問題集を追加
function addWB(i){
  var f=data.fields[i];
  if(!Array.isArray(f.workbooks))f.workbooks=fieldWorkbooks(f);
  f.workbooks.push({name:'問題集'+(f.workbooks.length+1),total:100,dailyGoal:5,prevSolved:0,counts:{},logs:[]});
  save();renderSettings();
}
// 問題集を別分野へ丸ごと移動（counts/logs/prevSolved/total全て保持）
function moveWB(i,j,targetIdx){
  targetIdx=parseInt(targetIdx);
  if(isNaN(targetIdx)||targetIdx===i)return;
  var src=data.fields[i];
  var dst=data.fields[targetIdx];
  if(!src||!dst)return;
  var srcWbs=fieldWorkbooks(src);
  if(srcWbs.length<=1){alert('この分野には問題集が1冊しかないため移動できません');return;}
  if(!Array.isArray(dst.workbooks))dst.workbooks=fieldWorkbooks(dst);
  var moved=src.workbooks.splice(j,1)[0];
  dst.workbooks.push(moved);
  save();renderSettings();
  showSync('☁ 「'+moved.name+'」を'+dst.name+'へ移動しました');
}
// 問題集を削除（最後の1冊は消せない）
function removeWB(i,j){
  var f=data.fields[i];
  var wbs=fieldWorkbooks(f);
  if(wbs.length<=1)return;
  if(!confirm('「'+wbs[j].name+'」を削除しますか？記録も消えます'))return;
  f.workbooks.splice(j,1);
  save();renderSettings();
}
function removeField(i){if(!confirm('「'+data.fields[i].name+'」を削除しますか？'))return;data.fields.splice(i,1);delete openCards[i];data.lastActiveField=undefined;save();renderSettings();}
function addField(){var inp=document.getElementById('new-name');var name=inp.value.trim();if(!name)return;var nf={name:name,total:100,dailyGoal:10,prevSolved:0,memo:'',counts:{},logs:[]};nf.workbooks=[{name:name,total:100,dailyGoal:10,prevSolved:0,counts:{},logs:[]}];data.fields.push(nf);inp.value='';setFieldFormOpen=false;save();renderSettings();}
function exportData(){var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='study_tracker_data.json';a.click();}
function importData(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{data=JSON.parse(ev.target.result);data.fields=data.fields||[];data.fields.forEach(function(f){if(!f.logs)f.logs=[];if(f.prevSolved===undefined)f.prevSolved=0;});migrateToWorkbooks(data);if(!data.unlockedAchievements)data.unlockedAchievements=[];migrateToExams(data);syncActiveExam();save();renderSettings();alert('読み込みました！');}catch(err){alert('ファイルが読み込めませんでした');}};reader.readAsText(file);}

initAuth();
</script>
